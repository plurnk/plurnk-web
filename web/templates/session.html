<!-- {§web-session-status} Public state supplies literal list values, not document markup. -->
<template id="session-descendant">
  <li data-otm-scope>
    <a data-text="descendant-name" data-bind="href:descendant-path"></a>
    <small><span data-text="descendant-kind"></span> <span data-i18n="descendant-separator">·</span> <span data-text="descendant-lifecycle"></span>
      <span data-i18n="descendant-pending-gates">· Pending requests:</span> <span data-text="descendant-gates"></span></small>
  </li>
</template>
<template id="session-descendant-children">
  <details><summary><span data-i18n="descendant-children">Children:</span> <span data-text="descendant-children"></span></summary><ul></ul></details>
</template>
<!-- {§web-session-diagnostics} Diagnostic values are text, never actions or conversation messages. -->
<template id="session-diagnostic">
    <li>
        <article data-bind="aria-label:diagnostic-label"></article>
    </li>
</template>
<!-- {§web-session-input} Native form structure; the session SDK owns delivery. -->
<template id="session-controls">
    <section aria-label="Session controls">
        <form id="session-compose">
            <ul data-compose-suggestions aria-label="Prompt suggestions"></ul>
            <ul data-compose-attachments aria-label="Queued attachments"></ul>
            <input type="file" data-attach-input accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
            <fieldset role="group" aria-label="Session actions">
                <button type="submit" form="session-stop" disabled data-bind="disabled:stop-unavailable" aria-label="Stop" title="Stop"></button>
                <button type="button" data-attach-image disabled data-bind="disabled:send-unavailable" aria-label="Attach image" title="Attach image"></button>
                <button type="button" data-insert-command disabled data-bind="disabled:send-unavailable" aria-label="Commands and skills" title="Commands and skills (/)"></button>
                <button type="button" data-open-sessions aria-label="Sessions" title="Sessions"></button>
                <textarea id="session-message" name="message" aria-label="Message" placeholder="Message…" rows="1" required></textarea>
                <button type="submit" form="session-compose" disabled data-bind="disabled:send-unavailable" aria-label="Send" aria-keyshortcuts="Enter Control+Enter Meta+Enter" title="Send (Enter · Ctrl+Enter)"></button>
            </fieldset>
        </form>
        <form id="session-stop"></form>
    </section>
</template>
<template id="compose-suggestion">
    <li data-suggestion-item data-suggestion-active="false">
        <button type="button" data-accept-suggestion data-suggestion-value=""><span data-text="suggestion-text"></span><small data-text="suggestion-detail"></small></button>
    </li>
</template>
<template id="compose-attachment">
    <li data-attachment-item>
        <span data-text="attachment-name"></span> <small data-text="attachment-size"></small>
        <button type="button" data-remove-attachment data-bind="aria-label:attachment-remove title:attachment-remove" aria-label="Remove attachment" title="Remove attachment"></button>
    </li>
</template>
<template id="session-feedback">
    <section aria-label="Message feedback" data-command-error="" data-message-status="">
        <p role="status" data-text="message-status">Connect to send a message.</p>
        <article role="alert" data-command-error>
            <header><span aria-hidden="true" data-text="warning-icon">⚠️</span> <strong data-i18n="request-failed">Request failed</strong></header>
            <p data-text="command-error">The request could not be confirmed.</p>
        </article>
    </section>
</template>
<template id="setting-option"><option data-bind="value:option-value disabled:option-disabled" data-text="option-label"></option></template>
<!-- {§web-session-commands} Multi-line client command output opens in a single modal, never conversation waterfall cards. -->
<template id="command-output-dialog">
    <dialog id="dialog-command-output" aria-label="Command output">
        <article>
            <header>
                <p><code data-text="command-title"></code></p>
                <button type="button" aria-label="Close" rel="prev" data-dialog-close></button>
            </header>
            <p role="status" data-text="command-message"></p>
            <pre data-command-literal-wrap><code data-text="command-literal"></code></pre>
        </article>
    </dialog>
</template>
<template id="command-help">
    <ul aria-label="Supported commands">
        <li data-command-name="help"><code data-i18n="command-help-usage">/help [command]</code> <span data-i18n="command-help-summary">Show these commands or one command's usage.</span></li>
        <li data-command-name="models"><code data-i18n="command-models-usage">/models [search]</code> <span data-i18n="command-models-summary">List aliases and search the available model catalog.</span></li>
        <li data-command-name="model"><code data-i18n="command-model-usage">/model [selector] [effort]</code> <span data-i18n="command-model-summary">Inspect or select this session's model.</span></li>
        <li data-command-name="effort"><code data-i18n="command-effort-usage">/effort [policy]</code> <span data-i18n="command-effort-summary">Inspect or select this session's reasoning effort.</span></li>
        <li data-command-name="persona"><code data-i18n="command-persona-usage">/persona [name|none]</code> <span data-i18n="command-persona-summary">Inspect or select this session's persona.</span></li>
        <li data-command-name="child"><code data-i18n="command-child-usage">/child [selector|inherit]</code> <span data-i18n="command-child-summary">Inspect or select this session's child-session model.</span></li>
        <li data-command-name="mode"><code data-i18n="command-mode-usage">/mode [review|accept|reject]</code> <span data-i18n="command-mode-summary">Inspect or select this session's approval policy.</span></li>
        <li data-command-name="workspaces"><code data-i18n="command-workspaces-usage">/workspaces</code> <span data-i18n="command-workspaces-summary">List workspaces on this daemon.</span></li>
        <li data-command-name="workspace"><code data-i18n="command-workspace-usage">/workspace [name]</code> <span data-i18n="command-workspace-summary">Inspect or switch the current workspace.</span></li>
        <li data-command-name="rename"><code data-i18n="command-rename-usage">/rename &lt;name&gt;</code> <span data-i18n="command-rename-summary">Rename the current workspace.</span></li>
        <li data-command-name="sessions"><code data-i18n="command-sessions-usage">/sessions</code> <span data-i18n="command-sessions-summary">List sessions in this workspace.</span></li>
        <li data-command-name="session"><code data-i18n="command-session-usage">/session [name]</code> <span data-i18n="command-session-summary">Inspect, open, or create a named session.</span></li>
        <li data-command-name="fork"><code data-i18n="command-fork-usage">/fork [name]</code> <span data-i18n="command-fork-summary">Fork this session's history into a sibling session.</span></li>
        <li data-command-name="parent"><code data-i18n="command-parent-usage">/parent</code> <span data-i18n="command-parent-summary">Navigate to this session's parent session.</span></li>
        <li data-command-name="enter"><code data-i18n="command-enter-usage">/enter</code> <span data-i18n="command-enter-summary">Navigate to this session's newest child session.</span></li>
        <li data-command-name="older"><code data-i18n="command-older-usage">/older</code> <span data-i18n="command-older-summary">Navigate to the previous sibling session.</span></li>
        <li data-command-name="newer"><code data-i18n="command-newer-usage">/newer</code> <span data-i18n="command-newer-summary">Navigate to the next sibling session.</span></li>
        <li data-command-name="loops"><code data-i18n="command-loops-usage">/loops</code> <span data-i18n="command-loops-summary">List loops in this session.</span></li>
        <li data-command-name="loop"><code data-i18n="command-loop-usage">/loop [n]</code> <span data-i18n="command-loop-summary">Inspect the latest or numbered loop transcript.</span></li>
        <li data-command-name="rollback"><code data-i18n="command-rollback-usage">/rollback &lt;loop&gt;/&lt;turn&gt;/&lt;item&gt;</code> <span data-i18n="command-rollback-summary">Reverse this session's file mutations after a log coordinate.</span></li>
        <li data-command-name="share"><code data-i18n="command-share-usage">/share &lt;folder&gt;</code> <span data-i18n="command-share-summary">Write a consistent diagnostic digest snapshot on the daemon host.</span></li>
        <li data-command-name="update"><code data-i18n="command-update-usage">/update</code> <span data-i18n="command-update-summary">Refresh the model catalog and check service version status.</span></li>
        <li data-command-name="review"><code data-i18n="command-review-usage">/review</code> <span data-i18n="command-review-summary">List pending permission and elicitation gates.</span></li>
        <li data-command-name="accept"><code data-i18n="command-accept-usage">/accept [@id]</code> <span data-i18n="command-accept-summary">Accept a pending gate (`/approve` is an alias).</span></li>
        <li data-command-name="approve"><code data-i18n="command-approve-usage">/approve [@id]</code> <span data-i18n="command-approve-summary">Approve a pending gate.</span></li>
        <li data-command-name="reject"><code data-i18n="command-reject-usage">/reject [@id]</code> <span data-i18n="command-reject-summary">Reject a pending gate.</span></li>
        <li data-command-name="cancel"><code data-i18n="command-cancel-usage">/cancel [@id]</code> <span data-i18n="command-cancel-summary">Cancel a pending gate.</span></li>
        <li data-command-name="edit"><code data-i18n="command-edit-usage">/edit [@id] &lt;body…&gt;</code> <span data-i18n="command-edit-summary">Approve a pending proposal with an edited body.</span></li>
        <li data-command-name="answer"><code data-i18n="command-answer-usage">/answer [@id] &lt;json&gt;</code> <span data-i18n="command-answer-summary">Submit a structured answer to a pending elicitation gate.</span></li>
        <li data-command-name="mcp"><code data-i18n="command-mcp-usage">/mcp [list|discover|add|replace|enable|disable|remove|oauth|skills|complete] …</code> <span data-i18n="command-mcp-summary">Inspect or manage workspace MCP servers.</span></li>
        <li data-command-name="skills"><code data-i18n="command-skills-usage">/skills [list|discover|add|replace|enable|disable|remove] …</code> <span data-i18n="command-skills-summary">Inspect or manage workspace skills.</span></li>
        <li data-command-name="schedule"><code data-i18n="command-schedule-usage">/schedule [list|inspect|discover|add|replace|run|done|reopen|enable|disable|remove] …</code> <span data-i18n="command-schedule-summary">Inspect, run, or manage workspace schedules and macros.</span></li>
        <li data-command-name="personas"><code data-i18n="command-personas-usage">/personas [list|discover|add|replace|enable|disable|remove] …</code> <span data-i18n="command-personas-summary">Inspect or manage workspace personas.</span></li>
        <li data-command-name="members"><code data-i18n="command-members-usage">/members [list|discover|add|enable|disable|remove] …</code> <span data-i18n="command-members-summary">Inspect or manage workspace file membership.</span></li>
        <li data-command-name="env"><code data-i18n="command-env-usage">/env [--scope session|workspace] [list|set|unset] …</code> <span data-i18n="command-env-summary">Inspect or manage session or workspace environment variables.</span></li>
        <li data-command-name="learn"><code data-i18n="command-learn-usage">/learn [--scope project|plurnk] [instructions]</code> <span data-i18n="command-learn-summary">Ask the session to distill reusable work into a project or Plurnk skill.</span></li>
        <li data-command-name="yolo"><code data-i18n="command-yolo-usage">/yolo</code> <span data-i18n="command-yolo-summary">Toggle session automatic approval (review / accept).</span></li>
        <li data-command-name="stop"><code data-i18n="command-stop-usage">/stop</code> <span data-i18n="command-stop-summary">Request cancellation of this session's active work.</span></li>
        <li data-command-name="logout"><code data-i18n="command-logout-usage">/logout</code> <span data-i18n="command-logout-summary">Sign out of this browser session.</span></li>
    </ul>
</template>
<template id="command-shortcuts">
    <dl aria-label="Keyboard shortcuts">
        <dt><kbd>Enter</kbd> · <kbd><span data-text="shortcut-mod">Ctrl</span>+Enter</kbd></dt><dd data-i18n="shortcut-send">Send message (touch keyboards keep Enter as a newline).</dd>
        <dt><kbd>Shift+Enter</kbd> · <kbd>Ctrl+J</kbd></dt><dd data-i18n="shortcut-newline">Insert a newline in the message field.</dd>
        <dt><kbd>↑</kbd> / <kbd>↓</kbd></dt><dd data-i18n="shortcut-history">Cycle previous prompts and commands in the message field.</dd>
        <dt><kbd>Tab</kbd></dt><dd data-i18n="shortcut-suggestion">Accept the lead prompt suggestion or command completion in the message field.</dd>
        <dt><kbd>Shift+Tab</kbd></dt><dd data-i18n="shortcut-yolo">Toggle session automatic approval (review / accept).</dd>
        <dt><kbd>Esc</kbd></dt><dd data-i18n="shortcut-escape">Leave message field, close open dialog, or request Stop.</dd>
        <dt><kbd>/</kbd> · <kbd>?</kbd></dt><dd data-i18n="shortcut-focus-help">Focus the message field or open this command and shortcut reference.</dd>
        <dt><kbd>Y</kbd> / <kbd>N</kbd> / <kbd>E</kbd> (<kbd>A</kbd> / <kbd>R</kbd>)</dt><dd data-i18n="shortcut-review">Select Accept, Reject, or Edit on a pending proposal; confirm with Enter.</dd>
        <dt><kbd><span data-text="shortcut-mod">Ctrl</span>+K</kbd> · <kbd>Alt+1…9</kbd> · <kbd>Alt+[</kbd> / <kbd>]</kbd> · <kbd>Alt+N</kbd></dt><dd data-i18n="shortcut-tabs">Switch workspace tabs or create a session.</dd>
    </dl>
</template>
<template id="command-model">
    <tr data-model-session-usable="false" data-model-ready="false">
        <th scope="row"><code data-text="model-selector">Provider/model</code></th>
        <td data-text="model-name">Model</td>
        <td data-text="model-context">0</td>
        <td data-text="model-efforts">Efforts</td>
        <td data-text="model-readiness">Readiness</td>
        <td>
            <form data-model-catalog-row-form>
                <fieldset data-bind="disabled:ws-settings-busy">
                    <input type="hidden" name="selector" data-bind="value:model-selector">
                    <button type="submit" name="operation" value="select" data-model-catalog-use-session data-i18n="ws-settings-use-in-session">Use in session</button>
                    <button type="submit" name="operation" value="child" data-model-catalog-use-child data-i18n="ws-settings-use-as-child">Use as child</button>
                </fieldset>
            </form>
        </td>
    </tr>
</template>
<template id="command-env">
    <section aria-label="Environment variables" data-env-panel data-env-count="0">
        <figure>
            <table>
                <thead><tr>
                    <th scope="col" data-i18n="env-variable">Variable</th>
                    <th scope="col" data-i18n="env-scope">Scope</th>
                    <th scope="col" data-i18n="env-state">State</th>
                    <th scope="col" data-i18n="env-actions">Actions</th>
                </tr></thead>
                <tbody></tbody>
            </table>
        </figure>
        <form data-env-set-form>
            <fieldset data-bind="disabled:env-busy">
                <select name="scope" aria-label="Variable scope">
                    <option value="session" data-i18n="env-scope-session">Session</option>
                    <option value="workspace" data-i18n="env-scope-workspace">Workspace</option>
                </select>
                <input type="text" name="alias" placeholder="NAME" aria-label="Variable name" autocomplete="off" spellcheck="false" required>
                <input type="password" name="value" placeholder="Value" aria-label="Variable value" autocomplete="off">
                <button type="submit" data-i18n="env-set">Set</button>
            </fieldset>
        </form>
    </section>
</template>
<template id="command-env-row">
    <tr data-env-removable="true" data-env-enabled="true">
        <th scope="row"><code data-text="env-alias">VARIABLE</code></th>
        <td data-text="env-origin">session</td>
        <td data-text="env-status">active</td>
        <td>
            <form data-env-row-form>
                <fieldset data-bind="disabled:env-busy">
                    <input type="hidden" name="alias" data-bind="value:env-alias">
                    <input type="hidden" name="origin" data-bind="value:env-origin">
                    <button type="submit" name="operation" value="enable" data-env-enable data-i18n="env-enable">Enable</button>
                    <button type="submit" name="operation" value="disable" data-env-disable data-i18n="env-disable">Disable</button>
                    <button type="submit" name="operation" value="remove" data-env-unset data-i18n="env-unset">Unset</button>
                </fieldset>
            </form>
        </td>
    </tr>
</template>
<!-- {§web-session-approval} One explicit decision per operation, one complete resume. -->
<template id="session-review">
    <form aria-label="Review requests" data-request-count="0">
        <fieldset disabled data-bind="disabled:review-unavailable">
            <legend data-i18n="input-required">Input required</legend>
            <p role="alert" data-deadline-notice data-i18n="deadline-passed">The decision deadline has passed; the daemon cancels these requests.</p>
            <div data-requests></div>
            <button type="submit" data-i18n="submit-responses">Submit responses</button>
        </fieldset>
    </form>
</template>
<!-- {§web-session-questions} Request data never supplies markup or application bindings. -->
<template id="session-question">
    <fieldset data-question data-response-error="">
        <legend><span data-request-origin><span data-i18n="request-session">Session</span> <span data-text="request-session">Unknown</span></span> <code data-text="request-tool">Question</code></legend>
        <p data-request-message></p>
        <details>
            <summary data-i18n="request-details">Request details</summary>
            <pre><code data-request-arguments></code></pre>
        </details>
        <details>
            <summary data-i18n="response-schema">Response schema</summary>
            <pre><code data-request-schema></code></pre>
        </details>
        <label><input type="checkbox" data-answer-cancel> <span data-i18n="cancel-request">Cancel this request</span></label>
        <fieldset data-answer-fields></fieldset>
        <p role="alert" data-response-error data-text="response-error">Answer validation failed.</p>
    </fieldset>
</template>
<template id="answer-field">
    <fieldset>
        <legend data-text="field-title">Answer field</legend>
        <p data-text="field-description">Field description</p>
        <label data-optional-answer><input type="checkbox" data-answer-include> <span data-i18n="include-answer">Include this answer</span></label>
        <fieldset data-answer-value></fieldset>
    </fieldset>
</template>
<template id="answer-text"><textarea rows="2" data-bind="aria-label:answer-label"></textarea></template>
<template id="answer-number"><input type="number" step="any" required data-bind="aria-label:answer-label"></template>
<template id="answer-boolean" data-otm-dynamic>
    <select required data-bind="aria-label:answer-label"><option value="" data-i18n="choose-answer">Choose an answer</option><option value="true" data-i18n="yes">Yes</option><option value="false" data-i18n="no">No</option></select>
</template>
<template id="answer-select" data-otm-dynamic>
    <select required data-bind="aria-label:answer-label"><option value="" data-i18n="choose-answer">Choose an answer</option></select>
</template>
<template id="answer-option"><option data-bind="value:option-value" data-text="option-label">Option</option></template>
<template id="answer-choice"><label><input type="checkbox" data-answer-choice data-bind="value:option-value"> <span data-text="option-label">Option</span></label></template>
<template id="answer-json"><label><span data-i18n="json-answer">Answer (JSON)</span><textarea rows="6" spellcheck="false" required></textarea></label></template>
<template id="session-proposal">
    <fieldset data-proposal-target-empty="false" data-proposal-has-diff="false" data-proposal-body-empty="false" data-proposal-editable="false">
        <legend><span data-text="proposal-session">Session</span> <code data-text="proposal-op">Operation</code></legend>
        <p data-proposal-target-line><code data-proposal-target></code></p>
        <pre data-proposal-diff><code></code></pre>
        <pre data-proposal-body-block><code data-proposal-body></code></pre>
        <p data-proposal-deadline-line><span data-i18n="decide-by">Decide by</span> <time data-bind="datetime:proposal-deadline" data-text="proposal-deadline-label"></time></p>
        <label><input type="radio" value="accept" required data-bind="name:proposal-choice"> <span data-i18n="accept">Accept</span></label>
        <label><input type="radio" value="reject" required data-bind="name:proposal-choice"> <span data-i18n="reject">Reject</span></label>
        <label data-proposal-edit-choice><input type="radio" value="edit" required data-bind="name:proposal-choice"> <span data-i18n="edit">Edit</span></label>
        <label data-proposal-edit-field><span data-i18n="edited-proposal-body">Edited body</span><textarea rows="4" spellcheck="false" data-proposal-edit-body data-bind="name:proposal-edit-name"></textarea></label>
    </fieldset>
</template>
<template id="proposal-diff-add"><ins data-diff-line="add"></ins></template>
<template id="proposal-diff-del"><del data-diff-line="del"></del></template>
<template id="proposal-diff-line"><span data-diff-line="context"></span></template>
