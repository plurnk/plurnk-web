<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#148800">
    <meta name="application-name" content="Plurnk">
    <meta name="description" content="Plurnk agent workspace.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <title data-text="page-title">Plurnk</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/plurnk.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="/styles/index.css">
    <script type="module" src="/app.js"></script>
</head>
<body>
    <header>
        <a href="/" title="Home"><img src="/icons/plurnk.svg" width="32" height="32" alt="Plurnk"></a>
        <nav aria-label="Main navigation">
            <ul>
                <li data-connection-indicator><span role="img" aria-label="Disconnected" title="Disconnected"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5v3M10 2.5v3M4 5.5h8v2a4 4 0 0 1-8 0v-2ZM8 11.5v2M2.5 2.5l11 11"/></svg></span></li>
                <!-- {§web-page-shell} Instantiated by the document server, not browser JavaScript. -->
                <template id="session-navigation" data-otm-dynamic>
                    <li><a href="/account/" aria-label="Account" title="Account"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.75"/><path d="M3 13.5c0-2.5 2.2-4.25 5-4.25s5 1.75 5 4.25"/></svg></a></li>
                    <li><form method="post" action="/auth/logout"><button type="submit" aria-label="Sign out" title="Sign out"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1H6M10.5 11l3-3-3-3M13.5 8H6.5"/></svg></button></form></li>
                </template>
            </ul>
        </nav>
    </header>
    <main id="main" data-page="home"></main>
    <!-- {§web-session-directory} Inert directory card templates; the overview subscription reconciles them in place. -->
    <template id="overview-list">
        <ul></ul>
    </template>
    <template id="overview-empty">
        <p data-i18n="no-sessions">No sessions.</p>
    </template>
    <template id="overview-background">
        <details><summary data-i18n="background-work">Background work</summary><ul></ul></details>
    </template>
    <template id="overview-controls">
        <section id="overview-controls" aria-label="Filter sessions">
            <input type="search" data-overview-search placeholder="Filter sessions…" aria-label="Filter sessions">
            <select data-overview-scope aria-label="Session scope">
                <option value="all" data-i18n="filter-all">All sessions</option>
                <option value="active" data-i18n="filter-active">Active only</option>
                <option value="roots" data-i18n="filter-roots">Root sessions</option>
            </select>
        </section>
    </template>
    <template id="session-card">
        <li data-directory-entry="session" data-session-key="" data-session-kind="root">
            <article aria-label="Session">
                <header>
                    <span data-session-identity><a data-session-link></a> <span data-lifecycle="idle" role="img" aria-label="idle" title="idle"></span> <span></span></span><span data-session-workspace><span data-folder="false" role="img" aria-label="Folderless workspace"></span> <a data-text="name"></a></span>
                </header>
            </article>
        </li>
    </template>
    <template id="session-parent-link">
        <span data-session-parent><a data-text="name" data-bind="href:session-path"></a> &gt; </span>
    </template>
    <template id="session-parent-text">
        <span data-session-parent><span></span> &gt; </span>
    </template>
    <template id="session-title-badge">
        <small data-session-title></small>
    </template>
    <template id="session-gates-badge">
        <small data-session-gates=""></small>
    </template>
    <template id="session-children-badge">
        <small data-session-children=""></small>
    </template>
    <template id="session-time-badge">
        <time data-session-time datetime=""></time>
    </template>
    <template id="session-excerpt-line">
        <small data-session-excerpt></small>
    </template>
    <template id="session-reply">
        <div data-session-reply=""></div>
    </template>
    <!-- {§web-workspace-tabs} Inert tab, breadcrumb and quick-switcher templates reconciled by workspace-workbench. -->
    <template id="workspace-tab-item">
        <li data-tab-id="" data-session-kind="root"><a data-workspace-route="session" data-tab-session=""><span data-lifecycle="idle" aria-hidden="true"></span><span data-tab-label></span></a></li>
    </template>
    <template id="workspace-switcher-active-badge">
        <small data-switcher-active=""></small>
    </template>
    <template id="workspace-breadcrumb-overview">
        <nav aria-label="breadcrumb"><ul><li><a href="/~/" aria-label="Workspaces" title="Workspaces"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></a></li><li><span role="img" aria-label="Folderless workspace" data-workspace-marker>☁️</span> <span aria-current="page" data-text="name"></span> <button type="button" data-dialog-target="dialog-workspace-rename" aria-label="Rename workspace" title="Rename workspace"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5a1.4 1.4 0 0 1 2 2L5.5 12.5 2.5 13.5l1-3 8-8Z"/></svg></button> <button type="button" data-dialog-target="dialog-workspace-archive" aria-label="Archive workspace" title="Archive workspace"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="3" rx="0.75"/><path d="M3.5 6v6.5a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V6M6.5 9h3"/></svg></button> <button type="button" data-dialog-target="dialog-session-create" aria-label="New session" title="New session"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v10M3 8h10"/></svg></button></li></ul></nav>
    </template>
    <template id="workspace-breadcrumb-session">
        <nav aria-label="breadcrumb"><ul><li><a href="/~/" aria-label="Workspaces" title="Workspaces"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></a></li><li><span id="session-workspace"><span role="img" aria-label="Folderless workspace" data-bind="aria-label:workspace-icon-label" data-text="workspace-icon">☁️</span> <a data-bind="href:workspace-path" data-text="workspace-name"></a></span></li><li><span aria-current="page" data-text="name"></span> <button type="button" data-dialog-target="dialog-session-archive" aria-label="Archive session" title="Archive session"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="3" rx="0.75"/><path d="M3.5 6v6.5a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V6M6.5 9h3"/></svg></button></li></ul></nav>
    </template>
    <template id="workspace-transitional-main">
        <main id="main" data-page="session" aria-busy="true"></main>
    </template>
    <template id="workspace-switcher-dialog">
        <dialog id="dialog-workspace-switcher" aria-label="Switch session">
            <article>
                <header>
                    <p><strong data-i18n="switch-session">Switch session</strong></p>
                    <button type="button" aria-label="Close" rel="prev" data-dialog-close></button>
                </header>
                <input type="search" data-switcher-search placeholder="Jump to session…" aria-label="Jump to session" autocomplete="off" spellcheck="false">
                <ul data-switcher-list></ul>
            </article>
        </dialog>
    </template>
    <template id="workspace-switcher-item">
        <li data-switcher-entry=""><a data-workspace-route="session"><span data-lifecycle="idle" aria-hidden="true"></span><span data-switcher-label></span></a></li>
    </template>
    <!-- {§web-workspace-settings} Lazy workspace subsystem management modal for capabilities, MCP, skills, schedules, personas, and env. -->
    <template id="workspace-open-settings">
        <button type="button" data-open-workspace-settings="" data-i18n="ws-settings-open">Settings</button>
    </template>
    <template id="workspace-settings-dialog">
        <dialog id="dialog-workspace-settings" aria-label="Workspace settings">
            <article data-bind="aria-busy:ws-settings-busy">
                <header>
                    <p><strong data-i18n="ws-settings-title">Workspace settings</strong></p>
                    <button type="button" aria-label="Close" rel="prev" data-dialog-close></button>
                </header>
                <nav aria-label="Settings sections">
                    <ul data-settings-nav>
                        <li><button type="button" data-settings-section="capabilities" aria-pressed="true" data-i18n="ws-settings-tab-capabilities">Capabilities</button></li>
                        <li><button type="button" data-settings-section="mcp" aria-pressed="false" data-i18n="ws-settings-tab-mcp">MCP</button></li>
                        <li><button type="button" data-settings-section="skills" aria-pressed="false" data-i18n="ws-settings-tab-skills">Skills</button></li>
                        <li><button type="button" data-settings-section="schedule" aria-pressed="false" data-i18n="ws-settings-tab-schedule">Schedule</button></li>
                        <li><button type="button" data-settings-section="personas" aria-pressed="false" data-i18n="ws-settings-tab-personas">Personas</button></li>
                        <li><button type="button" data-settings-section="env" aria-pressed="false" data-i18n="ws-settings-tab-env">Environment</button></li>
                    </ul>
                </nav>
                <p role="status" data-text="ws-settings-message"></p>
                <p data-text="ws-settings-recovery"></p>
                <section data-settings-panel="capabilities" aria-label="Capabilities" data-cap-count="0">
                    <form data-cap-preset-form>
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <select name="preset" aria-label="Capability posture">
                                <option value="propose" data-i18n="ws-settings-cap-propose">Ask before mutations (default)</option>
                                <option value="allow" data-i18n="ws-settings-cap-allow-all">Auto-approve workspace operations</option>
                                <option value="deny" data-i18n="ws-settings-cap-read-only">Read-only (deny mutations, execution &amp; control)</option>
                            </select>
                            <button type="submit" data-i18n="ws-settings-apply-posture">Apply posture</button>
                        </fieldset>
                    </form>
                    <p data-cap-empty data-i18n="ws-settings-cap-empty">No workspace capability overrides.</p>
                    <figure data-cap-table-wrap>
                        <table>
                            <thead><tr>
                                <th scope="col" data-i18n="ws-settings-cap-list">List</th>
                                <th scope="col" data-i18n="ws-settings-cap-selector">Selector</th>
                                <th scope="col" data-i18n="ws-settings-col-actions">Actions</th>
                            </tr></thead>
                            <tbody data-cap-rows></tbody>
                        </table>
                    </figure>
                    <form data-cap-rule-form>
                        <fieldset data-bind="disabled:ws-settings-busy">
                            <legend data-i18n="ws-settings-add-rule">Add capability rule</legend>
                            <select name="bucket" aria-label="Rule list">
                                <option value="allow" data-i18n="ws-settings-bucket-allow">Allow (pre-approve)</option>
                                <option value="only" data-i18n="ws-settings-bucket-only">Only (restrict to)</option>
                                <option value="deny" data-i18n="ws-settings-bucket-deny">Deny</option>
                            </select>
                            <select name="access" aria-label="Access level">
                                <option value="" data-i18n="ws-settings-access-any">Any access level</option>
                                <option value="observe" data-i18n="ws-settings-access-observe">observe</option>
                                <option value="mutate" data-i18n="ws-settings-access-mutate">mutate</option>
                                <option value="execute" data-i18n="ws-settings-access-execute">execute</option>
                                <option value="interact" data-i18n="ws-settings-access-interact">interact</option>
                                <option value="control" data-i18n="ws-settings-access-control">control</option>
                            </select>
                            <input type="text" name="operation" aria-label="Operation" placeholder="Operation (e.g. edit, sh)" autocomplete="off" spellcheck="false">
                            <input type="text" name="runtime" aria-label="Runtime" placeholder="Runtime (e.g. sh, js)" autocomplete="off" spellcheck="false">
                            <input type="text" name="scheme" aria-label="Scheme" placeholder="Scheme (e.g. file, mcp)" autocomplete="off" spellcheck="false">
                            <input type="text" name="tool" aria-label="Tool" placeholder="Tool name" autocomplete="off" spellcheck="false">
                            <input type="text" name="traits" aria-label="Traits" placeholder="Traits (comma-separated)" autocomplete="off" spellcheck="false">
                            <button type="submit" data-i18n="ws-settings-save-rule">Add rule</button>
                        </fieldset>
                    </form>
                    <details>
                        <summary data-i18n="ws-settings-cap-layers">Policy layers</summary>
                        <dl>
                            <dt data-i18n="capability-service">Service</dt><dd><pre><code data-ws-capability="service"></code></pre></dd>
                            <dt data-i18n="capability-workspace">Workspace</dt><dd><pre><code data-ws-capability="workspace"></code></pre></dd>
                            <dt data-i18n="capability-effective">Effective</dt><dd><pre><code data-ws-capability="effective"></code></pre></dd>
                        </dl>
                    </details>
                </section>
                <section data-settings-panel="mcp" aria-label="MCP servers" data-family-count="0" data-candidate-count="0" hidden>
                    <p data-family-empty data-i18n="ws-settings-mcp-empty">No MCP servers configured.</p>
                    <figure data-family-table-wrap>
                        <table>
                            <thead><tr>
                                <th scope="col" data-i18n="ws-settings-col-alias">Alias</th>
                                <th scope="col" data-i18n="ws-settings-col-origin">Origin</th>
                                <th scope="col" data-i18n="ws-settings-col-details">Details</th>
                                <th scope="col" data-i18n="ws-settings-col-state">State</th>
                                <th scope="col" data-i18n="ws-settings-col-actions">Actions</th>
                            </tr></thead>
                            <tbody data-family-rows></tbody>
                        </table>
                    </figure>
                    <section data-mcp-oauth-box aria-label="MCP OAuth authorization" hidden>
                        <p><span data-i18n="ws-settings-oauth-open">Authorize server:</span> <a data-mcp-oauth-link href="/" target="_blank" rel="noopener noreferrer" data-bind="href:mcp-oauth-url" data-text="mcp-oauth-url"></a></p>
                        <form data-mcp-oauth-complete-form>
                            <fieldset role="group" data-bind="disabled:ws-settings-busy">
                                <input type="hidden" name="alias" data-bind="value:mcp-oauth-alias">
                                <input type="url" name="callbackUrl" aria-label="OAuth callback URL" placeholder="Callback URL from authorization" autocomplete="off" required>
                                <button type="submit" data-i18n="ws-settings-oauth-complete">Complete authorization</button>
                            </fieldset>
                        </form>
                    </section>
                    <form data-family-discover-form data-family="mcp">
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <input type="search" name="query" aria-label="Search MCP registry" placeholder="Search MCP registry…" autocomplete="off" required>
                            <button type="submit" data-i18n="ws-settings-discover">Discover</button>
                        </fieldset>
                    </form>
                    <ul data-candidate-rows></ul>
                    <form data-mcp-save-form data-mcp-transport="stdio" data-mcp-auth="none">
                        <fieldset data-bind="disabled:ws-settings-busy">
                            <legend data-i18n="ws-settings-save-mcp">Add or update MCP server</legend>
                            <select name="transport" aria-label="MCP transport">
                                <option value="stdio" data-i18n="ws-settings-mcp-stdio">Local command (stdio)</option>
                                <option value="streamable-http" data-i18n="ws-settings-mcp-http">Remote endpoint (Streamable HTTP)</option>
                            </select>
                            <input type="text" name="alias" aria-label="Server alias" placeholder="server-alias" autocomplete="off" spellcheck="false" required>
                            <div data-mcp-stdio-fields>
                                <input type="text" name="command" aria-label="Server command" placeholder="Command (e.g. npx)" autocomplete="off" spellcheck="false">
                                <input type="text" name="args" aria-label="Server arguments" placeholder="Arguments (space-separated)" autocomplete="off" spellcheck="false">
                                <input type="text" name="cwd" aria-label="Working directory" placeholder="Working directory (optional)" autocomplete="off" spellcheck="false">
                            </div>
                            <div data-mcp-http-fields>
                                <input type="url" name="url" aria-label="Endpoint URL" placeholder="https://mcp.example.com/mcp" autocomplete="off" spellcheck="false">
                                <select name="authMode" aria-label="Endpoint authentication">
                                    <option value="none" data-i18n="ws-settings-auth-none">No authorization</option>
                                    <option value="bearer" data-i18n="ws-settings-auth-bearer">Bearer token reference</option>
                                    <option value="oauth" data-i18n="ws-settings-auth-oauth">OAuth 2.1</option>
                                </select>
                                <input type="text" name="bearerToken" data-mcp-bearer-field aria-label="Bearer token reference" placeholder="${MCP_TOKEN}" autocomplete="off" spellcheck="false">
                            </div>
                            <button type="submit" data-i18n="ws-settings-save-server">Save server</button>
                        </fieldset>
                    </form>
                </section>
                <section data-settings-panel="skills" aria-label="Skills" data-family-count="0" data-candidate-count="0" hidden>
                    <p data-family-empty data-i18n="ws-settings-skills-empty">No skills configured.</p>
                    <figure data-family-table-wrap>
                        <table>
                            <thead><tr>
                                <th scope="col" data-i18n="ws-settings-col-alias">Alias</th>
                                <th scope="col" data-i18n="ws-settings-col-origin">Origin</th>
                                <th scope="col" data-i18n="ws-settings-col-details">Details</th>
                                <th scope="col" data-i18n="ws-settings-col-state">State</th>
                                <th scope="col" data-i18n="ws-settings-col-actions">Actions</th>
                            </tr></thead>
                            <tbody data-family-rows></tbody>
                        </table>
                    </figure>
                    <form data-family-discover-form data-family="skills">
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <input type="text" name="source" aria-label="Skill discovery source" placeholder="Git URL, folder, archive, or server:///skills" autocomplete="off" spellcheck="false" required>
                            <button type="submit" data-i18n="ws-settings-discover">Discover</button>
                        </fieldset>
                    </form>
                    <ul data-candidate-rows></ul>
                    <form data-skills-save-form>
                        <fieldset data-bind="disabled:ws-settings-busy">
                            <legend data-i18n="ws-settings-save-skill-heading">Add or update skill</legend>
                            <input type="text" name="alias" aria-label="Skill name" placeholder="skill-name" autocomplete="off" spellcheck="false" required>
                            <input type="text" name="source" aria-label="Skill source" placeholder="https://git.example/skills.git or /path/to/skill" autocomplete="off" spellcheck="false" required>
                            <input type="text" name="ref" aria-label="Git ref" placeholder="Branch or tag (optional)" autocomplete="off" spellcheck="false">
                            <button type="submit" data-i18n="ws-settings-save-skill">Save skill</button>
                        </fieldset>
                    </form>
                </section>
                <section data-settings-panel="schedule" aria-label="Schedules" data-family-count="0" data-candidate-count="0" hidden>
                    <p data-family-empty data-i18n="ws-settings-schedule-empty">No schedules configured.</p>
                    <figure data-family-table-wrap>
                        <table>
                            <thead><tr>
                                <th scope="col" data-i18n="ws-settings-col-alias">Alias</th>
                                <th scope="col" data-i18n="ws-settings-col-origin">Origin</th>
                                <th scope="col" data-i18n="ws-settings-col-details">Details</th>
                                <th scope="col" data-i18n="ws-settings-col-state">State</th>
                                <th scope="col" data-i18n="ws-settings-col-actions">Actions</th>
                            </tr></thead>
                            <tbody data-family-rows></tbody>
                        </table>
                    </figure>
                    <form data-family-discover-form data-family="schedule">
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <input type="text" name="rule" aria-label="Preview schedule rule" placeholder="0 9 * * 1-5 or FREQ=DAILY;BYHOUR=9" autocomplete="off" spellcheck="false" required>
                            <button type="submit" data-i18n="ws-settings-preview-rule">Preview</button>
                        </fieldset>
                    </form>
                    <ul data-candidate-rows></ul>
                    <form data-schedule-save-form>
                        <fieldset data-bind="disabled:ws-settings-busy">
                            <legend data-i18n="ws-settings-save-schedule-heading">Add or update schedule</legend>
                            <input type="text" name="alias" aria-label="Schedule name" placeholder="nightly-check" autocomplete="off" spellcheck="false" required>
                            <input type="text" name="target" aria-label="Target session" placeholder="user" autocomplete="off" spellcheck="false" required>
                            <input type="text" name="rule" aria-label="Schedule rule" placeholder="0 9 * * 1-5 or FREQ=DAILY" autocomplete="off" spellcheck="false" required>
                            <textarea name="prompt" aria-label="Scheduled prompt" placeholder="Message delivered at each occurrence" rows="2" required></textarea>
                            <button type="submit" data-i18n="ws-settings-save-schedule">Save schedule</button>
                        </fieldset>
                    </form>
                </section>
                <section data-settings-panel="personas" aria-label="Personas" data-family-count="0" data-candidate-count="0" hidden>
                    <form data-session-persona-form hidden>
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <select name="persona" aria-label="Active session persona"></select>
                            <button type="submit" data-i18n="ws-settings-apply-persona">Apply to session</button>
                        </fieldset>
                    </form>
                    <p data-family-empty data-i18n="ws-settings-personas-empty">No personas configured.</p>
                    <figure data-family-table-wrap>
                        <table>
                            <thead><tr>
                                <th scope="col" data-i18n="ws-settings-col-alias">Alias</th>
                                <th scope="col" data-i18n="ws-settings-col-origin">Origin</th>
                                <th scope="col" data-i18n="ws-settings-col-details">Details</th>
                                <th scope="col" data-i18n="ws-settings-col-state">State</th>
                                <th scope="col" data-i18n="ws-settings-col-actions">Actions</th>
                            </tr></thead>
                            <tbody data-family-rows></tbody>
                        </table>
                    </figure>
                    <form data-family-discover-form data-family="personas">
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <input type="text" name="source" aria-label="Persona discovery path" placeholder="Directory or file path (optional)" autocomplete="off" spellcheck="false">
                            <button type="submit" data-i18n="ws-settings-discover">Discover</button>
                        </fieldset>
                    </form>
                    <ul data-candidate-rows></ul>
                    <form data-personas-save-form data-persona-mode="inline">
                        <fieldset data-bind="disabled:ws-settings-busy">

    <template id="operation-operand">
        <span data-plurnk-operand></span>
    </template>
    <template id="operation-field">
        <span></span>
    </template>
    <template id="operation-outcome">
        <span data-plurnk-field="outcome"></span>
    </template>
    <!-- {§web-diagram-content} Only the generated data-URI image enters this template. -->
    <template id="diagram-retry">
        <button type="button" data-diagram-retry data-i18n="diagram-retry">Retry diagram</button>
    </template>
    <template id="conversation-diagram">
        <figure data-diagram hidden>
            <div data-diagram-viewport><img alt="Mermaid diagram; source below."></div>
            <details>
                <summary data-i18n="diagram-source">Diagram source</summary>
                <pre><code data-diagram-source></code></pre>
            </details>
        </figure>
    </template>
</body>
</html>
