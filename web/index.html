<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#148800">
    <meta name="application-name" content="Plurnk">
    <meta name="description" content="Plurnk agent workspace.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Plurnk">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title data-i18n="title">Plurnk</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/plurnk-16.png" type="image/png" sizes="16x16">
    <link rel="icon" href="/icons/plurnk-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/icons/plurnk.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="/icons/plurnk-180.png" sizes="180x180">
    <link rel="stylesheet" href="/styles/app-vendor.css">
    <link rel="stylesheet" href="/styles/app-structure.css">
    <link rel="stylesheet" href="/styles/app-style.css">
    <link rel="stylesheet" href="/styles/app-state.css">
    <script type="module" src="/app.js"></script>
</head>
<body>
    <a href="#main" data-i18n="skip-navigation">Skip to content</a>
    <header>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="/"><img src="/icons/plurnk.svg" width="32" height="32" alt=""> <strong data-i18n="brand">Plurnk</strong></a></li>
            </ul>
            <ul>
                <li><a href="/~/" data-i18n="workspaces">Workspaces</a></li>
                <!-- {§web-page-shell} Instantiated by the document server, not browser JavaScript. -->
                <template id="session-navigation" data-otm-dynamic>
                    <li><a href="/account/" data-i18n="account">Account</a></li>
                    <li><form method="post" action="/auth/logout"><button type="submit" data-i18n="sign-out">Sign out</button></form></li>
                </template>
            </ul>
        </nav>
    </header>
    <main id="main" tabindex="-1" data-page="home">
        <h1 data-i18n="home-title">Plurnk</h1>
        <p data-i18n="introduction">Browse your workspaces and workers.</p>
    </main>
</body>
</html>
