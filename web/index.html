<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#148800">
    <meta name="application-name" content="Plurnk">
    <meta name="description" content="Plurnk agent workspace.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <title data-text="page-title">Plurnk</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/plurnk.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="/styles/index.css">
    <script type="module" src="/app.js"></script>
</head>
<body>
    <header>
        <a href="/" title="Home"><img src="/icons/plurnk.svg" width="32" height="32" alt="Plurnk"></a>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="/~/" aria-label="Workspaces" title="Workspaces" data-text="workspaces-icon">📁</a></li>
                <!-- {§web-page-shell} Instantiated by the document server, not browser JavaScript. -->
                <template id="session-navigation" data-otm-dynamic>
                    <li><a href="/account/" aria-label="Account" title="Account" data-text="account-icon">⚙️</a></li>
                    <li><form method="post" action="/auth/logout"><button type="submit" aria-label="Sign out" title="Sign out" data-text="sign-out-icon">✖</button></form></li>
                </template>
            </ul>
        </nav>
    </header>
    <main id="main" tabindex="-1" data-page="home"></main>
    <!-- {§web-worker-status} Public state supplies literal list values, not document markup. -->
    <template id="worker-descendant">
      <li>
        <a data-text="descendant-name" data-bind="href:descendant-path"></a>
        <small><span data-text="descendant-kind"></span> <span data-i18n="descendant-separator">·</span> <span data-text="descendant-lifecycle"></span>
          <span data-i18n="descendant-pending-gates">· Pending requests:</span> <span data-text="descendant-gates"></span></small>
      </li>
    </template>
    <template id="worker-descendant-children">
      <details><summary><span data-i18n="descendant-children">Children:</span> <span data-text="descendant-children"></span></summary><ul></ul></details>
    </template>
    <!-- {§web-worker-streams} Current membership, observed outcomes and explicit output snapshots are distinct. -->
    <template id="worker-stream">
        <li>
            <details>
                <summary><code data-text="stream-target">Stream address</code></summary>
                <p><span data-i18n="stream-worker">Worker:</span> <span data-text="stream-worker">Worker</span>
                    <span data-i18n="stream-lifetime">Lifetime:</span> <span data-text="stream-lifetime">Lifetime</span></p>
                <ul data-stream-channels></ul>
            </details>
        </li>
    </template>
    <template id="worker-stream-channel">
        <li>
            <code data-text="stream-channel">Channel</code> <span data-text="stream-state">State</span> <small data-text="stream-mime">Content type</small>
            <p><span data-i18n="stream-length">Last observed length (code points):</span> <span data-text="stream-length">Not observed</span></p>
        </li>
    </template>
    <template id="worker-stream-outcome">
        <li>
            <details>
                <summary><code data-text="stream-target">Stream address</code> <span data-text="stream-scheme">Executor</span></summary>
                <p><span data-i18n="stream-worker">Worker:</span> <span data-text="stream-worker">Worker</span></p>
                <p data-text="stream-summary">Stream concluded.</p>
                <article data-stream-failure>
                    <header><span aria-hidden="true" data-i18n="stream-failed-icon">❌</span> <strong data-text="stream-problem-title">Stream failed</strong></header>
                    <p data-text="stream-problem">Failure details</p>
                </article>
                <pre><code data-text="stream-result">Result</code></pre>
            </details>
        </li>
    </template>
    <template id="stream-output">
        <section data-entry-output aria-label="Output snapshot">
            <button type="button" data-action="read-output" data-bind="disabled:output-pending" data-i18n="read-output">Read output</button>
            <p data-output-loading role="status" data-i18n="reading-output">Reading output…</p>
            <article data-output-failure role="alert">
                <header><span aria-hidden="true" data-i18n="output-warning">⚠️</span> <strong data-i18n="output-read-failed">Output read failed</strong></header>
                <p data-text="output-error">The output could not be read.</p>
            </article>
            <div data-output-snapshot>
                <p data-i18n="output-snapshot">Output snapshot; read again to refresh.</p>
                <ul></ul>
            </div>
        </section>
    </template>
    <template id="stream-output-channel">
        <li>
            <details>
                <summary><code data-text="output-channel">Channel</code> <span data-text="output-channel-state">State</span></summary>
                <p><small data-text="output-mime">Content type</small></p>
                <p><span data-i18n="output-offset">Offset (code points):</span> <span data-text="output-offset">0</span>
                    <span data-i18n="output-length">Length:</span> <span data-text="output-length">0</span></p>
                <pre><code data-text="output-content"></code></pre>
            </details>
        </li>
    </template>
    <template id="conversation-body-reference">
      <section data-body-reference aria-label="Body">
        <p><code data-text="body-address">Body address</code> <small data-text="body-mime">Content type</small></p>
        <button type="button" data-action="read-body" data-bind="disabled:body-pending" data-i18n="read-body">Read body</button>
        <p data-body-loading role="status" data-i18n="reading-body">Reading body…</p>
        <article data-body-failure role="alert">
          <header><span aria-hidden="true" data-i18n="body-warning">⚠️</span> <strong data-i18n="body-read-failed">Body read failed</strong></header>
          <p data-text="body-error">The body could not be read.</p>
        </article>
        <pre data-body-content><code data-text="body-content"></code></pre>
      </section>
    </template>
    <template id="worker-preparation">
        <li><code data-text="preparation-family">Capability</code> <span data-text="preparation-alias">Alias</span>
            <span data-text="preparation-phase">Preparing</span> <time data-text="preparation-since" data-bind="datetime:preparation-since">Start time</time></li>
    </template>
    <template id="worker-pending-message">
        <li><dl>
            <div><dt data-i18n="message-address">Address</dt><dd><code data-text="inbox-path">Message address</code></dd></div>
            <div><dt data-i18n="client-message-id">Client message ID</dt><dd data-text="inbox-id">None</dd></div>
            <div><dt data-i18n="message-loop">Loop</dt><dd data-text="inbox-loop">Unknown</dd></div>
            <div><dt data-i18n="message-lifecycle">State</dt><dd data-text="inbox-lifecycle">Unknown</dd></div>
        </dl></li>
    </template>
    <!-- {§web-worker-diagnostics} Diagnostic values are text, never actions or conversation messages. -->
    <template id="worker-diagnostic">
        <li>
            <article>
                <header><span aria-hidden="true" data-text="diagnostic-icon">⚠️</span> <strong data-text="diagnostic-title">Diagnostic</strong> <small data-text="diagnostic-attribution">Subagent</small></header>
                <p data-text="diagnostic-message">Diagnostic message</p>
                <p data-text="diagnostic-recovery">Recovery</p>
                <details>
                    <summary data-i18n="diagnostic-details">Details</summary>
                    <pre><code data-text="diagnostic-details">Diagnostic evidence</code></pre>
                </details>
            </article>
        </li>
    </template>
    <!-- {§web-worker-activity} Observations are literal evidence, not replies or executable markup. -->
    <template id="worker-ambient">
        <li>
            <details>
                <summary><span data-text="activity-operation">Log entry</span> <code data-text="activity-coordinate">Coordinate</code>
                    <span data-i18n="activity-worker">Worker:</span> <span data-text="activity-worker">Worker</span></summary>
                <dl>
                    <div><dt data-i18n="activity-origin">Origin</dt><dd data-text="activity-origin">Origin</dd></div>
                    <div><dt data-i18n="activity-state">Row state</dt><dd data-text="activity-state">State</dd></div>
                    <div><dt data-i18n="activity-status">Receipt status</dt><dd data-text="activity-status">Status</dd></div>
                    <div><dt data-i18n="activity-time">Time</dt><dd><time data-text="activity-at" data-bind="datetime:activity-at">Time</time></dd></div>
                    <div data-activity-source><dt data-i18n="activity-source">Source</dt><dd data-text="activity-source">Source</dd></div>
                    <div data-activity-attribution><dt data-i18n="activity-attribution">Subagent</dt><dd data-text="activity-attribution">Subagent</dd></div>
                </dl>
                <details><summary data-i18n="activity-evidence">Row details</summary><pre><code data-text="activity-evidence">Row evidence</code></pre></details>
                <section aria-label="Receipt body"><p data-i18n="activity-body">Receipt body</p><div data-activity-body></div></section>
                <section aria-label="Reasoning"><p data-i18n="activity-reasoning">Reasoning</p><div data-activity-reasoning></div></section>
            </details>
        </li>
    </template>
    <template id="worker-outside">
        <li>
            <details>
                <summary><span data-i18n="outside-operations">Outside operations</span> <code data-text="activity-coordinate">Coordinate</code></summary>
                <p data-activity-attribution><span data-i18n="activity-attribution">Subagent:</span> <span data-text="activity-attribution">Subagent</span></p>
                <p><span data-i18n="activity-tokens">Tokens:</span> <span data-text="activity-tokens">0</span></p>
                <pre><code data-text="activity-text">Outside-operation text</code></pre>
            </details>
        </li>
    </template>
    <!-- {§web-worker-input} Native form structure; the worker SDK owns delivery. -->
    <template id="worker-controls">
        <section aria-label="Worker controls" data-command-error="">
            <form id="worker-compose">
                <label for="worker-message" data-i18n="message">Message</label>
                <textarea id="worker-message" name="message" rows="3" required></textarea>
                <button type="submit" disabled data-bind="disabled:send-unavailable" data-i18n="send">Send</button>
            </form>
            <form id="worker-stop">
                <button type="submit" disabled data-bind="disabled:stop-unavailable" data-i18n="stop">Stop</button>
            </form>
            <p role="status" data-text="message-status">Connect to send a message.</p>
            <article role="alert" data-command-error>
                <header><span aria-hidden="true" data-text="warning-icon">⚠️</span> <strong data-i18n="request-failed">Request failed</strong></header>
                <p data-text="command-error">The request could not be confirmed.</p>
            </article>
        </section>
    </template>
    <!-- {§web-worker-approval} One explicit decision per operation, one complete resume. -->
    <template id="worker-review">
        <form aria-label="Review requests" data-request-count="0">
            <fieldset disabled data-bind="disabled:review-unavailable">
                <legend data-i18n="input-required">Input required</legend>
                <div data-requests></div>
                <button type="submit" data-i18n="submit-responses">Submit responses</button>
            </fieldset>
        </form>
    </template>
    <!-- {§web-worker-questions} Request data never supplies markup or application bindings. -->
    <template id="worker-question">
        <fieldset data-question data-response-error="">
            <legend><span data-request-origin><span data-i18n="request-worker">Worker</span> <span data-text="request-worker">Unknown</span></span> <code data-text="request-tool">Question</code></legend>
            <p data-text="request-message">Provide the requested input.</p>
            <details>
                <summary data-i18n="request-details">Request details</summary>
                <pre><code data-text="request-arguments">Request details</code></pre>
            </details>
            <details>
                <summary data-i18n="response-schema">Response schema</summary>
                <pre><code data-text="request-schema">Response schema</code></pre>
            </details>
            <label><input type="checkbox" data-answer-cancel> <span data-i18n="cancel-request">Cancel this request</span></label>
            <fieldset data-answer-fields></fieldset>
            <p role="alert" data-response-error data-text="response-error">Answer validation failed.</p>
        </fieldset>
    </template>
    <template id="answer-field">
        <fieldset>
            <legend data-text="field-title">Answer field</legend>
            <p data-text="field-description">Field description</p>
            <label data-optional-answer><input type="checkbox" data-answer-include> <span data-i18n="include-answer">Include this answer</span></label>
            <fieldset data-answer-value></fieldset>
        </fieldset>
    </template>
    <template id="answer-text"><textarea rows="2" data-bind="aria-label:answer-label"></textarea></template>
    <template id="answer-number"><input type="number" step="any" required data-bind="aria-label:answer-label"></template>
    <template id="answer-boolean" data-otm-dynamic>
        <select required data-bind="aria-label:answer-label"><option value="" data-i18n="choose-answer">Choose an answer</option><option value="true" data-i18n="yes">Yes</option><option value="false" data-i18n="no">No</option></select>
    </template>
    <template id="answer-select" data-otm-dynamic>
        <select required data-bind="aria-label:answer-label"><option value="" data-i18n="choose-answer">Choose an answer</option></select>
    </template>
    <template id="answer-option"><option data-bind="value:option-value" data-text="option-label">Option</option></template>
    <template id="answer-json"><label><span data-i18n="json-answer">Answer (JSON)</span><textarea rows="6" spellcheck="false" required></textarea></label></template>
    <template id="worker-proposal">
        <fieldset>
            <legend><span data-text="proposal-worker">Worker</span> <code data-text="proposal-op">Operation</code></legend>
            <pre><code data-text="proposal-target">Target</code></pre>
            <pre><code data-text="proposal-body">Operation body</code></pre>
            <details>
                <summary data-i18n="review-details">Review details</summary>
                <pre><code data-text="proposal-details">Proposal evidence</code></pre>
            </details>
            <label><input type="radio" value="accept" required data-bind="name:proposal-choice"> <span data-i18n="accept">Accept</span></label>
            <label><input type="radio" value="reject" required data-bind="name:proposal-choice"> <span data-i18n="reject">Reject</span></label>
        </fieldset>
    </template>
    <!-- {§web-worker-conversation} Inert document-owned structure; HttpAgent supplies its values. -->
    <template id="worker-reasoning-preview">
        <section data-reasoning-preview aria-label="Live reasoning">
            <p data-i18n="live-reasoning">Live reasoning</p>
            <pre><code data-text="reasoning-text"></code></pre>
        </section>
    </template>
    <template id="conversation-message">
        <li>
            <article>
                <header><strong data-text="message-label">Message</strong> <span data-text="message-author">Author</span> <small data-text="message-attribution">Subagent</small></header>
                <div data-message-body></div>
                <ul data-calls></ul>
            </article>
        </li>
    </template>
    <template id="conversation-detail">
        <li>
            <details>
                <summary><strong data-text="message-label">Message</strong> <span data-text="message-author">Author</span> <small data-text="message-attribution">Subagent</small></summary>
                <p data-text="message-error">Tool failed.</p>
                <p data-call-link><a data-bind="href:call-href" data-i18n="view-call">View call</a></p>
                <div data-message-body></div>
            </details>
        </li>
    </template>
    <template id="conversation-call">
        <li data-bind="id:call-anchor">
            <details>
                <summary><code data-text="call-name">Tool call</code> <small data-text="call-aside">Category</small></summary>
                <div data-call-content></div>
            </details>
        </li>
    </template>
    <template id="conversation-arguments">
        <pre><code data-text="call-arguments">No arguments.</code></pre>
    </template>
    <template id="conversation-note">
        <section>
            <div data-message-body></div>
            <details>
                <summary data-i18n="note-arguments">Arguments</summary>
                <pre><code data-text="call-arguments">No arguments.</code></pre>
            </details>
        </section>
    </template>
    <template id="conversation-literal">
        <pre><code data-text="literal-content">No content.</code></pre>
    </template>
    <!-- {§web-diagram-content} Only the generated data-URI image enters this template. -->
    <template id="conversation-diagram">
        <figure data-diagram hidden>
            <div data-diagram-viewport><img data-bind="src:diagram-url" alt="Mermaid diagram; source below."></div>
            <details>
                <summary data-i18n="diagram-source">Diagram source</summary>
                <pre><code data-text="diagram-source">Diagram source</code></pre>
            </details>
        </figure>
    </template>
</body>
</html>
