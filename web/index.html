<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#148800">
    <meta name="application-name" content="Plurnk">
    <meta name="description" content="Plurnk agent workspace.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <title data-text="page-title">Plurnk</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/plurnk.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="/styles/index.css">
    <script type="module" src="/app.js"></script>
</head>
<body>
    <header>
        <a href="/" title="Home"><img src="/icons/plurnk.svg" width="32" height="32" alt="Plurnk"></a>
        <nav aria-label="Main navigation">
            <ul>
                <li data-connection-indicator><span role="img" aria-label="Disconnected" title="Disconnected"></span></li>
                <!-- {§web-page-shell} Instantiated by the document server, not browser JavaScript. -->
                <template id="session-navigation" data-otm-dynamic>
                    <li><a href="/account/" aria-label="Account" title="Account" data-text="account-icon">⚙️</a></li>
                    <li><form method="post" action="/auth/logout"><button type="submit" aria-label="Sign out" title="Sign out" data-text="sign-out-icon">✖</button></form></li>
                </template>
            </ul>
        </nav>
    </header>
    <main id="main" data-page="home"></main>
    <!-- {§web-session-directory} Inert directory card templates; the overview subscription reconciles them in place. -->
    <template id="overview-list">
        <ul></ul>
    </template>
    <template id="overview-empty">
        <p data-i18n="no-sessions">No sessions.</p>
    </template>
    <template id="overview-background">
        <details><summary data-i18n="background-work">Background work</summary><ul></ul></details>
    </template>
    <template id="overview-controls">
        <section id="overview-controls" aria-label="Filter sessions">
            <input type="search" data-overview-search placeholder="Filter sessions…" aria-label="Filter sessions">
            <select data-overview-scope aria-label="Session scope">
                <option value="all" data-i18n="filter-all">All sessions</option>
                <option value="active" data-i18n="filter-active">Active only</option>
                <option value="roots" data-i18n="filter-roots">Root sessions</option>
            </select>
        </section>
    </template>
    <template id="session-card">
        <li data-directory-entry="session" data-session-key="" data-session-kind="root">
            <article aria-label="Session">
                <header>
                    <span data-session-identity><a data-session-link></a> <span data-lifecycle="idle" role="img" aria-label="idle" title="idle"></span> <span></span></span><span data-session-workspace><span data-folder="false" role="img" aria-label="Folderless workspace"></span> <a data-text="name"></a></span>
                </header>
            </article>
        </li>
    </template>
    <template id="session-parent-link">
        <span data-session-parent><a data-text="name" data-bind="href:session-path"></a> &gt; </span>
    </template>
    <template id="session-parent-text">
        <span data-session-parent><span></span> &gt; </span>
    </template>
    <template id="session-title-badge">
        <small data-session-title></small>
    </template>
    <template id="session-gates-badge">
        <small data-session-gates=""></small>
    </template>
    <template id="session-children-badge">
        <small data-session-children=""></small>
    </template>
    <template id="session-time-badge">
        <time data-session-time datetime=""></time>
    </template>
    <template id="session-excerpt-line">
        <small data-session-excerpt></small>
    </template>
    <template id="session-reply">
        <div data-session-reply=""></div>
    </template>
    <!-- {§web-session-status} Public state supplies literal list values, not document markup. -->
    <template id="session-descendant">
      <li>
        <a data-text="descendant-name" data-bind="href:descendant-path"></a>
        <small><span data-text="descendant-kind"></span> <span data-i18n="descendant-separator">·</span> <span data-text="descendant-lifecycle"></span>
          <span data-i18n="descendant-pending-gates">· Pending requests:</span> <span data-text="descendant-gates"></span></small>
      </li>
    </template>
    <template id="session-descendant-children">
      <details><summary><span data-i18n="descendant-children">Children:</span> <span data-text="descendant-children"></span></summary><ul></ul></details>
    </template>
    <template id="conversation-body-reference">
        <pre data-body-reference data-bind="aria-busy:body-pending"></pre>
    </template>
    <template id="conversation-body-retry">
        <form><button type="submit" data-i18n="retry-body">Retry</button></form>
    </template>
    <template id="conversation-body-read">
        <form><button type="submit" data-i18n="read-body">Read</button></form>
    </template>
    <!-- {§web-session-diagnostics} Diagnostic values are text, never actions or conversation messages. -->
    <template id="session-diagnostic">
        <li>
            <article data-bind="aria-label:diagnostic-label"></article>
        </li>
    </template>
    <!-- {§web-session-input} Native form structure; the session SDK owns delivery. -->
    <template id="session-controls">
        <section aria-label="Session controls">
            <form id="session-compose">
                <fieldset role="group" aria-label="Session actions">
                    <button type="submit" form="session-stop" disabled data-bind="disabled:stop-unavailable" aria-label="Stop" title="Stop"></button>
                    <textarea id="session-message" name="message" aria-label="Message" rows="1" required></textarea>
                    <button type="submit" form="session-compose" disabled data-bind="disabled:send-unavailable" aria-label="Send" aria-keyshortcuts="Control+Enter" title="Send (Ctrl+Enter)"></button>
                </fieldset>
            </form>
            <form id="session-stop"></form>
        </section>
    </template>
    <template id="session-feedback">
        <section aria-label="Message feedback" data-command-error="" data-message-status="">
            <p role="status" data-text="message-status">Connect to send a message.</p>
            <article role="alert" data-command-error>
                <header><span aria-hidden="true" data-text="warning-icon">⚠️</span> <strong data-i18n="request-failed">Request failed</strong></header>
                <p data-text="command-error">The request could not be confirmed.</p>
            </article>
        </section>
    </template>
    <!-- {§web-session-settings} Native disclosures and forms reuse the command action boundary. -->
    <template id="model-settings">
        <article id="session-model-settings" aria-label="Model selection" tabindex="-1" hidden>
            <form data-setting="model" data-bind="aria-busy:settings-pending">
                <input id="session-model-choice" type="search" name="selection" list="session-model-options" aria-label="Search Models" placeholder="Search Models" autocomplete="off" spellcheck="false" required data-bind="disabled:settings-pending">
                <datalist id="session-model-options"></datalist>
                <fieldset role="group">
                    <button type="button" data-cancel-settings data-bind="disabled:settings-pending" data-i18n="cancel">Cancel</button>
                    <button type="submit" data-bind="disabled:selection-unavailable" data-i18n="select-model">Select Model</button>
                </fieldset>
            </form>
            <p role="status" data-text="settings-message"></p>
            <p data-text="settings-recovery"></p>
        </article>
    </template>
    <template id="effort-settings">
        <article id="session-effort-settings" aria-label="Effort selection" tabindex="-1" hidden>
            <form data-setting="effort" data-bind="aria-busy:settings-pending">
                <select id="session-effort-choice" name="selection" aria-label="Reasoning Effort" required disabled data-bind="disabled:selection-unavailable">
                    <option value="" disabled selected data-i18n="reasoning-effort">Reasoning Effort</option>
                </select>
                <fieldset role="group">
                    <button type="button" data-cancel-settings data-bind="disabled:settings-pending" data-i18n="cancel">Cancel</button>
                    <button type="submit" disabled data-bind="disabled:selection-unavailable" data-i18n="select-effort">Select Effort</button>
                </fieldset>
            </form>
            <p role="status" data-text="settings-message"></p>
            <p data-text="settings-recovery"></p>
        </article>
    </template>
    <template id="setting-option"><option data-bind="value:option-value disabled:option-disabled" data-text="option-label"></option></template>
    <!-- {§web-session-commands} Command results are local presentation, not conversation messages. -->
    <template id="command-results">
        <section id="session-command-results" aria-label="Command results">
            <ul></ul>
        </section>
    </template>
    <template id="session-command-result">
        <li>
            <article data-command-state="pending" data-bind="aria-busy:command-busy">
                <header><code></code></header>
                <p role="status" data-text="command-message">Running…</p>
                <div data-command-output></div>
                <p data-text="command-recovery"></p>
            </article>
        </li>
    </template>
    <template id="command-help">
        <ul aria-label="Supported commands">
            <li data-command-name="help"><code data-i18n="command-help-usage">/help [command]</code> <span data-i18n="command-help-summary">Show these commands or one command's usage.</span></li>
            <li data-command-name="models"><code data-i18n="command-models-usage">/models [search]</code> <span data-i18n="command-models-summary">List aliases and search the available model catalog.</span></li>
            <li data-command-name="model"><code data-i18n="command-model-usage">/model [selector] [effort]</code> <span data-i18n="command-model-summary">Inspect or select this session's model.</span></li>
            <li data-command-name="effort"><code data-i18n="command-effort-usage">/effort [policy]</code> <span data-i18n="command-effort-summary">Inspect or select this session's reasoning effort.</span></li>
            <li data-command-name="capabilities"><code data-i18n="command-capabilities-usage">/capabilities [json]</code> <span data-i18n="command-capabilities-summary">Inspect or replace the workspace capability policy.</span></li>
            <li data-command-name="yolo"><code data-i18n="command-yolo-usage">/yolo</code> <span data-i18n="command-yolo-summary">Toggle automatic approval on this page.</span></li>
            <li data-command-name="stop"><code data-i18n="command-stop-usage">/stop</code> <span data-i18n="command-stop-summary">Request cancellation of this session's active work.</span></li>
        </ul>
    </template>
    <template id="command-models">
        <section aria-label="Available models">
            <h2 data-i18n="model-aliases">Aliases</h2>
            <p data-no-aliases data-i18n="no-aliases">No matching aliases.</p>
            <ul data-model-aliases></ul>
            <h2 data-i18n="model-catalog">Model catalog</h2>
            <p>
                <span data-i18n="model-offset">Offset:</span> <span data-text="model-offset">0</span>
                <span data-i18n="models-shown">Shown:</span> <span data-text="model-count">0</span>
                <span data-i18n="models-total">Total:</span> <span data-text="model-total">0</span>
            </p>
            <p data-text="model-more">Narrow the search for more matches.</p>
            <figure>
                <table>
                    <thead><tr>
                        <th scope="col" data-i18n="model-selector">Selector</th>
                        <th scope="col" data-i18n="model-name">Name</th>
                        <th scope="col" data-i18n="model-context">Context</th>
                        <th scope="col" data-i18n="model-efforts">Efforts</th>
                        <th scope="col" data-i18n="model-readiness">Readiness</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </figure>
        </section>
    </template>
    <template id="command-alias">
        <li>
            <code data-text="alias-name">Alias</code>
            <span data-text="alias-route">Provider/model</span>
            <span data-text="alias-effort">Effort</span>
            <span data-text="alias-active">Default</span>
        </li>
    </template>
    <template id="command-model">
        <tr>
            <th scope="row"><code data-text="model-selector">Provider/model</code></th>
            <td data-text="model-name">Model</td>
            <td data-text="model-context">0</td>
            <td data-text="model-efforts">Efforts</td>
            <td data-text="model-readiness">Readiness</td>
        </tr>
    </template>
    <template id="command-capabilities">
        <dl>
            <dt data-i18n="capability-service">Service</dt><dd><pre><code data-capability="service"></code></pre></dd>
            <dt data-i18n="capability-workspace">Workspace</dt><dd><pre><code data-capability="workspace"></code></pre></dd>
            <dt data-i18n="capability-effective">Effective</dt><dd><pre><code data-capability="effective"></code></pre></dd>
        </dl>
    </template>
    <!-- {§web-session-approval} One explicit decision per operation, one complete resume. -->
    <template id="session-review">
        <form aria-label="Review requests" data-request-count="0">
            <fieldset disabled data-bind="disabled:review-unavailable">
                <legend data-i18n="input-required">Input required</legend>
                <p role="alert" data-deadline-notice data-i18n="deadline-passed">The decision deadline has passed; the daemon cancels these requests.</p>
                <div data-requests></div>
                <button type="submit" data-i18n="submit-responses">Submit responses</button>
            </fieldset>
        </form>
    </template>
    <!-- {§web-session-questions} Request data never supplies markup or application bindings. -->
    <template id="session-question">
        <fieldset data-question data-response-error="">
            <legend><span data-request-origin><span data-i18n="request-session">Session</span> <span data-text="request-session">Unknown</span></span> <code data-text="request-tool">Question</code></legend>
            <p data-request-message></p>
            <details>
                <summary data-i18n="request-details">Request details</summary>
                <pre><code data-request-arguments></code></pre>
            </details>
            <details>
                <summary data-i18n="response-schema">Response schema</summary>
                <pre><code data-request-schema></code></pre>
            </details>
            <label><input type="checkbox" data-answer-cancel> <span data-i18n="cancel-request">Cancel this request</span></label>
            <fieldset data-answer-fields></fieldset>
            <p role="alert" data-response-error data-text="response-error">Answer validation failed.</p>
        </fieldset>
    </template>
    <template id="answer-field">
        <fieldset>
            <legend data-text="field-title">Answer field</legend>
            <p data-text="field-description">Field description</p>
            <label data-optional-answer><input type="checkbox" data-answer-include> <span data-i18n="include-answer">Include this answer</span></label>
            <fieldset data-answer-value></fieldset>
        </fieldset>
    </template>
    <template id="answer-text"><textarea rows="2" data-bind="aria-label:answer-label"></textarea></template>
    <template id="answer-number"><input type="number" step="any" required data-bind="aria-label:answer-label"></template>
    <template id="answer-boolean" data-otm-dynamic>
        <select required data-bind="aria-label:answer-label"><option value="" data-i18n="choose-answer">Choose an answer</option><option value="true" data-i18n="yes">Yes</option><option value="false" data-i18n="no">No</option></select>
    </template>
    <template id="answer-select" data-otm-dynamic>
        <select required data-bind="aria-label:answer-label"><option value="" data-i18n="choose-answer">Choose an answer</option></select>
    </template>
    <template id="answer-option"><option data-bind="value:option-value" data-text="option-label">Option</option></template>
    <template id="answer-choice"><label><input type="checkbox" data-answer-choice data-bind="value:option-value"> <span data-text="option-label">Option</span></label></template>
    <template id="answer-json"><label><span data-i18n="json-answer">Answer (JSON)</span><textarea rows="6" spellcheck="false" required></textarea></label></template>
    <template id="session-proposal">
        <fieldset>
            <legend><span data-text="proposal-session">Session</span> <code data-text="proposal-op">Operation</code></legend>
            <pre><code data-proposal-target></code></pre>
            <pre><code data-proposal-body></code></pre>
            <p data-proposal-deadline-line><span data-i18n="decide-by">Decide by</span> <time data-bind="datetime:proposal-deadline" data-text="proposal-deadline-label"></time></p>
            <label><input type="radio" value="accept" required data-bind="name:proposal-choice"> <span data-i18n="accept">Accept</span></label>
            <label><input type="radio" value="reject" required data-bind="name:proposal-choice"> <span data-i18n="reject">Reject</span></label>
        </fieldset>
    </template>
    <!-- {§web-session-conversation} Inert document-owned structure; the ACP client supplies its values. -->
    <template id="conversation-history">
        <li data-history-boundary>
            <form data-bind="aria-busy:history-pending">
                <button type="submit" data-bind="disabled:history-pending" data-i18n="load-previous-loop">Load previous loop</button>
                <p role="alert" data-text="history-error"></p>
            </form>
        </li>
    </template>
    <template id="session-reasoning-preview">
        <article data-reasoning-preview aria-label="Live reasoning">
            <header data-text="reasoning-coordinate"></header>
            <pre></pre>
        </article>
    </template>
    <template id="conversation-loop">
        <li>
            <details open>
                <summary><span><span data-i18n="loop-heading">Loop</span> <span data-text="loop-seq">1</span></span></summary>
                <ul></ul>
            </details>
        </li>
    </template>
    <template id="conversation-operations">
        <li data-operations="">
            <details>
                <summary data-bind="aria-label:operations-label"><span></span></summary>
                <ul></ul>
            </details>
        </li>
    </template>
    <template id="operation-tally">
        <span data-operation-tally><span data-plurnk-field="heading"></span><span data-plurnk-field="count"></span></span>
    </template>
    <template id="conversation-plan">
        <li data-loop-plan>
            <article aria-label="Open tasks">
                <ul></ul>
            </article>
        </li>
    </template>
    <template id="conversation-plan-item">
        <li data-text="plan-item"></li>
    </template>
    <template id="prompt-replies">
        <ul data-prompt-replies></ul>
    </template>
    <template id="conversation-message">
        <li>
            <article data-bind="aria-label:message-label"></article>
        </li>
    </template>
    <!-- {§web-card-disclosure} Summary fields are phrasing content, not nested headers or paragraphs. -->
    <template id="card-disclosure">
        <details><summary></summary></details>
    </template>
    <template id="card-header">
        <header></header>
    </template>
    <template id="conversation-literal">
        <pre></pre>
    </template>
    <!-- {§web-operation-summary} Shared summary; the stylesheet owns operation glyphs. -->
    <template id="operation-header">
        <span data-plurnk-field="heading"></span>
    </template>
    <template id="operation-operands">
        <span data-plurnk-operands></span>
    </template>
    <template id="operation-operand">
        <span data-plurnk-operand></span>
    </template>
    <template id="operation-field">
        <span></span>
    </template>
    <template id="operation-outcome">
        <span data-plurnk-field="outcome"></span>
    </template>
    <!-- {§web-diagram-content} Only the generated data-URI image enters this template. -->
    <template id="diagram-retry">
        <button type="button" data-diagram-retry data-i18n="diagram-retry">Retry diagram</button>
    </template>
    <template id="conversation-diagram">
        <figure data-diagram hidden>
            <div data-diagram-viewport><img alt="Mermaid diagram; source below."></div>
            <details>
                <summary data-i18n="diagram-source">Diagram source</summary>
                <pre><code data-diagram-source></code></pre>
            </details>
        </figure>
    </template>
</body>
</html>
