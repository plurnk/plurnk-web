<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#148800">
    <meta name="application-name" content="Plurnk">
    <meta name="description" content="Plurnk agent workspace.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <title data-i18n="title">Plurnk</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/plurnk.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="/styles/index.css">
    <script type="module" src="/app.js"></script>
</head>
<body>
    <header>
        <a href="/" title="Home"><img src="/icons/plurnk.svg" width="32" height="32" alt="Plurnk"></a>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="/~/" aria-label="Workspaces" title="Workspaces" data-text="workspaces-icon">📁</a></li>
                <!-- {§web-page-shell} Instantiated by the document server, not browser JavaScript. -->
                <template id="session-navigation" data-otm-dynamic>
                    <li><a href="/account/" aria-label="Account" title="Account" data-text="account-icon">⚙️</a></li>
                    <li><form method="post" action="/auth/logout"><button type="submit" aria-label="Sign out" title="Sign out" data-text="sign-out-icon">✖</button></form></li>
                </template>
            </ul>
        </nav>
    </header>
    <main id="main" tabindex="-1" data-page="home"></main>
    <!-- {§web-worker-input} Native form structure; the worker SDK owns delivery. -->
    <template id="worker-controls">
        <section aria-label="Worker controls" data-command-error="">
            <form id="worker-compose">
                <label for="worker-message" data-i18n="message">Message</label>
                <textarea id="worker-message" name="message" rows="3" required></textarea>
                <button type="submit" disabled data-bind="disabled:send-unavailable" data-i18n="send">Send</button>
            </form>
            <form id="worker-stop">
                <button type="submit" disabled data-bind="disabled:stop-unavailable" data-i18n="stop">Stop</button>
            </form>
            <p role="status" data-text="message-status">Connect to send a message.</p>
            <article role="alert" data-command-error>
                <header><span aria-hidden="true" data-text="warning-icon">⚠️</span> <strong data-i18n="request-failed">Request failed</strong></header>
                <p data-text="command-error">The request could not be confirmed.</p>
            </article>
        </section>
    </template>
    <!-- {§web-worker-approval} One explicit decision per operation, one complete resume. -->
    <template id="worker-approval">
        <form aria-label="Review operations" data-proposal-count="0">
            <fieldset disabled data-bind="disabled:review-unavailable">
                <legend data-i18n="approval-required">Approval required</legend>
                <div data-proposals></div>
                <button type="submit" data-i18n="submit-decisions">Submit decisions</button>
            </fieldset>
        </form>
    </template>
    <template id="worker-proposal">
        <fieldset>
            <legend><span data-text="proposal-worker">Worker</span> <code data-text="proposal-op">Operation</code></legend>
            <pre><code data-text="proposal-target">Target</code></pre>
            <pre><code data-text="proposal-body">Operation body</code></pre>
            <details>
                <summary data-i18n="review-details">Review details</summary>
                <pre><code data-text="proposal-details">Proposal evidence</code></pre>
            </details>
            <label><input type="radio" value="accept" required data-bind="name:proposal-choice"> <span data-i18n="accept">Accept</span></label>
            <label><input type="radio" value="reject" required data-bind="name:proposal-choice"> <span data-i18n="reject">Reject</span></label>
        </fieldset>
    </template>
    <!-- {§web-worker-conversation} Inert document-owned structure; HttpAgent supplies its values. -->
    <template id="conversation-message">
        <li>
            <article>
                <header><strong data-text="message-label">Message</strong> <span data-text="message-author">Author</span> <small data-text="message-attribution">Subagent</small></header>
                <div data-message-body></div>
                <ul data-calls></ul>
            </article>
        </li>
    </template>
    <template id="conversation-detail">
        <li>
            <details>
                <summary><strong data-text="message-label">Message</strong> <span data-text="message-author">Author</span> <small data-text="message-attribution">Subagent</small></summary>
                <p data-text="message-error">Tool failed.</p>
                <p data-call-link><a data-bind="href:call-href" data-i18n="view-call">View call</a></p>
                <div data-message-body></div>
            </details>
        </li>
    </template>
    <template id="conversation-call">
        <li data-bind="id:call-anchor">
            <details>
                <summary><code data-text="call-name">Tool call</code> <small data-text="call-aside">Category</small></summary>
                <div data-call-content></div>
            </details>
        </li>
    </template>
    <template id="conversation-arguments">
        <pre><code data-text="call-arguments">No arguments.</code></pre>
    </template>
    <template id="conversation-note">
        <section>
            <div data-message-body></div>
            <details>
                <summary data-i18n="note-arguments">Arguments</summary>
                <pre><code data-text="call-arguments">No arguments.</code></pre>
            </details>
        </section>
    </template>
    <template id="conversation-literal">
        <pre><code data-text="literal-content">No content.</code></pre>
    </template>
    <!-- {§web-diagram-content} Only the generated data-URI image enters this template. -->
    <template id="conversation-diagram">
        <figure data-diagram hidden>
            <div data-diagram-viewport><img data-bind="src:diagram-url" alt="Mermaid diagram; source below."></div>
            <details>
                <summary data-i18n="diagram-source">Diagram source</summary>
                <pre><code data-text="diagram-source">Diagram source</code></pre>
            </details>
        </figure>
    </template>
</body>
</html>
