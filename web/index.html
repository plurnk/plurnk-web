<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#148800">
    <meta name="application-name" content="Plurnk">
    <meta name="description" content="Plurnk agent workspace.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <title data-text="page-title">Plurnk</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/plurnk.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="/styles/index.css">
    <script type="module" src="/app.js"></script>
</head>
<body>
    <header>
        <a href="/search/" data-nav="search" aria-label="Search" title="Search (Ctrl+K)"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.25 3.25"/></svg> <span data-header-label data-i18n="search">Search</span></a>
        <nav aria-label="Main navigation">
            <ul>
                <li data-connection-indicator><span role="img" aria-label="Disconnected" title="Disconnected"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5v3M10 2.5v3M4 5.5h8v2a4 4 0 0 1-8 0v-2ZM8 11.5v2M2.5 2.5l11 11"/></svg></span></li>
                <!-- {§web-page-shell} Instantiated by the document server, not browser JavaScript. -->
                <template id="session-navigation" data-otm-dynamic>
                    <li><a href="/account/" data-nav="account" aria-label="Account" title="Account"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.75"/><path d="M3 13.5c0-2.5 2.2-4.25 5-4.25s5 1.75 5 4.25"/></svg> <span data-header-label data-i18n="account">Account</span></a></li>
                </template>
            </ul>
        </nav>
    </header>
    <main id="main" data-page="home"></main>
    <!-- {§web-session-directory} Inert directory card templates; the overview subscription reconciles them in place. -->
    <template id="overview-list">
        <ul></ul>
    </template>
    <template id="overview-workspace-list">
        <ul data-workspace-sessions></ul>
    </template>
    <template id="overview-empty">
        <p data-i18n="no-sessions">No matching sessions.</p>
    </template>
    <template id="workspaces-empty">
        <p data-i18n="no-workspaces">No matching workspaces.</p>
    </template>
    <template id="overview-background">
        <details data-workspace-background><summary data-i18n="background-work">Background work</summary><ul></ul></details>
    </template>
    <template id="workspace-card">
        <li data-directory-entry="workspace" data-workspace-id="" data-workspace-name="" data-folder="false">
            <article aria-label="Folderless workspace">
                <header><a data-text="name"></a></header>
            </article>
        </li>
    </template>
    <template id="workspace-project-note">
        <small data-text="project-label"></small>
    </template>
    <template id="workspace-unarchive-form">
        <form method="post" action="/workspaces/unarchive" data-inline-unarchive><input type="hidden" name="workspace" value=""><button type="submit" data-i18n="unarchive">Unarchive</button></form>
    </template>
    <template id="session-card">
        <li data-directory-entry="session" data-session-key="" data-session-kind="root">
            <article aria-label="Session">
                <header>
                    <span data-session-identity><span data-lifecycle="idle" role="img" aria-label="idle" title="idle"></span> <a data-session-link><span data-session-headline></span></a></span>
                </header>
            </article>
        </li>
    </template>
    <template id="session-parent-link">
        <span data-session-parent><a data-text="name" data-bind="href:session-path"></a> &gt; </span>
    </template>
    <template id="session-parent-text">
        <span data-session-parent><span></span> &gt; </span>
    </template>
    <template id="session-handle-badge">
        <small data-session-handle></small>
    </template>
    <template id="session-gates-badge">
        <small data-session-gates=""></small>
    </template>
    <template id="session-children-badge">
        <small data-session-children=""></small>
    </template>
    <template id="session-meta-group">
        <span data-session-meta></span>
    </template>
    <template id="session-time-badge">
        <time data-session-time datetime=""></time>
    </template>
    <template id="session-unarchive-form">
        <form method="post" action="/sessions/unarchive" data-inline-unarchive><input type="hidden" name="workspace" value=""><input type="hidden" name="session" value=""><button type="submit" data-i18n="unarchive">Unarchive</button></form>
    </template>
    <template id="session-excerpt-line">
        <small data-session-excerpt></small>
    </template>
    <!-- {§web-workspace-tabs} Inert tab, pane, and quick-switcher templates reconciled by workspace-workbench. -->
    <template id="workspace-tab-item">
        <li data-tab-id="" data-session-kind="root"><a data-workspace-route="session" data-tab-session=""><span data-lifecycle="idle" aria-hidden="true"></span><span data-tab-label></span></a></li>
    </template>
    <template id="workspace-session-main">
        <main id="main" data-page="session" data-session-name="">
            <p id="session-folder" data-project-label=""><span role="img" aria-label="Project folder">🗂️</span> <span data-text="project-label"></span></p>
            <article id="session-connection" role="alert"><header><span><span aria-hidden="true">⚠️</span> <span data-text="connection-label">Not connected.</span></span><form id="session-reconnect" action="/" data-bind="action:session-path" data-reconnect><button type="submit" data-i18n="reconnect">Reconnect</button></form><a data-sign-in href="/auth/login" data-bind="href:sign-in-path" data-i18n="sign-in">Sign in</a></header><p data-text="connection-detail">Displayed values are no longer live.</p></article>
            <section id="session-diagnostics" aria-label="Diagnostics"><ul></ul></section>
            <section id="session-conversation" aria-label="Conversation"><p data-empty-conversation data-i18n="no-messages">No messages.</p><ul data-messages></ul></section>
        </main>
    </template>
    <template id="workspace-session-footer">
        <footer id="session-status" aria-label="Session status" data-workspace-id="" data-session-id="" data-session-name="" data-auth="none" data-connection="initial">
            <p role="status" data-text="connection-label">Not connected.</p>
            <div data-status-line>
                <ul aria-label="Model controls">
                    <li data-status-field="session"><a id="session-current" href="/settings/" data-bind="href:session-settings-path" aria-label="Session">#<span data-text="session-name"></span></a></li>
                    <li data-status-field="model" data-bind="aria-label:model-label title:model-label"><a id="session-model" href="/settings/" data-bind="href:models-settings-path" aria-label="Model"><span data-text="model">No model</span></a><a id="session-effort" href="/settings/" data-bind="href:models-settings-path" aria-label="Effort"><span data-text="effort"></span></a></li>
                </ul>
                <div data-status-telemetry>
                    <ul aria-label="Active session activity">
                        <li data-status-field="lifecycle" data-bind="aria-label:lifecycle title:lifecycle"></li>
                        <li data-status-field="elapsed" aria-label="Latest loop elapsed time" title="Latest loop elapsed time"><time data-text="elapsed"></time></li>
                        <li data-status-field="descendants"><details id="session-descendants"><summary data-bind="aria-label:descendants-label title:descendants-label"><span data-text="descendants">0</span></summary><ul></ul></details></li>
                        <li data-status-field="gated" data-bind="aria-label:gated-label title:gated-label"><span data-text="gated">0</span></li>
                        <li data-status-field="wait"><span data-i18n="wait-remaining">updates in</span> <time data-text="wait" data-bind="datetime:wait-at title:wait-at"></time></li>
                        <li data-status-field="inbox" data-bind="aria-label:inbox-label title:inbox-label"><span data-text="inbox">0</span></li>
                        <li data-status-field="preparation" data-text="preparation"></li>
                        <li data-status-field="activity" data-text="activity" data-bind="title:activity-message"></li>
                    </ul>
                    <details id="session-usage">
                        <summary aria-label="Session usage and cost" title="Session usage and cost"><span aria-hidden="true">ⓘ</span> <span data-usage-context data-text="context-high"></span></summary>
                        <ul aria-label="Session statistics">
                            <li data-status-field="usage" data-bind="aria-label:usage-label title:usage-label"><span data-text="input">?</span> <span data-text="output">?</span></li>
                            <li data-status-field="context" data-bind="aria-label:context-label title:context-label"><span data-text="context"></span></li>
                            <li data-status-field="cost" data-text="cost" data-bind="aria-label:cost-label title:cost-label">?</li>
                        </ul>
                    </details>
                </div>
            </div>
        </footer>
    </template>
    <template id="workspace-switcher-dialog">
        <dialog id="dialog-workspace-switcher" aria-label="Switch session">
            <article>
                <header>
                    <p><strong data-i18n="switch-session">Sessions</strong></p>
                    <button type="button" aria-label="Close" rel="prev" data-dialog-close></button>
                </header>
                <div data-switcher-actions>
                    <button type="button" data-switcher-new-session data-i18n="new-session">New session</button>
                </div>
                <input type="search" data-switcher-search placeholder="Jump to session…" aria-label="Jump to session" autocomplete="off" spellcheck="false">
                <ul data-switcher-list></ul>
                <details data-switcher-archived hidden>
                    <summary><span data-i18n="archived-sessions">Archived sessions</span> (<span data-text="archived-session-count">0</span>)</summary>
                    <ul data-switcher-archived-list></ul>
                </details>
                <footer>
                    <a href="/search/" data-i18n="search-all-workspaces">Search workspaces and sessions…</a>
                </footer>
            </article>
        </dialog>
    </template>
    <template id="workspace-switcher-item">
        <li data-switcher-entry=""><a data-workspace-route="session"><span data-lifecycle="idle" aria-hidden="true"></span><span data-switcher-label></span></a></li>
    </template>
    <template id="workspace-switcher-archived-item">
        <li data-switcher-archived-entry=""><span data-switcher-archived-label></span><form method="post" action="/sessions/unarchive" data-inline-unarchive><input type="hidden" name="workspace" value=""><input type="hidden" name="session" value=""><button type="submit" data-i18n="unarchive">Unarchive</button></form></li>
    </template>
    <!-- {§web-workspace-settings} Dedicated settings page templates for session policy, models, MCP, skills, schedules, personas, members, env, and help. -->
    <template id="session-config-controls">
        <form data-session-config-form hidden>
            <fieldset data-bind="disabled:ws-settings-busy">
                <label>
                    <span data-i18n="model-label">Model</span>
                    <select name="model" aria-label="Active session model"></select>
                </label>
                <label>
                    <span data-i18n="ws-settings-persona-effort-label">Reasoning effort</span>
                    <select name="effort" aria-label="Reasoning effort"></select>
                </label>
                <label>
                    <span data-i18n="child-session-model">Child session model</span>
                    <select name="spawnModel" aria-label="Child session model"></select>
                </label>
                <label>
                    <span data-i18n="persona-label">Persona</span>
                    <select name="persona" aria-label="Active session persona"></select>
                </label>
                <label>
                    <span data-i18n="approval-policy">Approval policy</span>
                    <select name="mode" aria-label="Approval policy"></select>
                </label>
                <footer>
                    <button type="submit" data-i18n="ws-settings-apply-persona">Apply to session</button>
                </footer>
            </fieldset>
        </form>
    </template>
    <template id="workspace-settings-subsystems">
        <div data-settings-panels>
            <section data-settings-panel="models" aria-label="Models" data-alias-count="0" hidden>
                <header data-panel-toolbar>
                    <h2 data-i18n="ws-settings-tab-models">Models</h2>
                </header>
                <p data-models-aliases-empty data-i18n="no-aliases">No matching aliases.</p>
                <figure data-models-aliases-wrap>
                    <table>
                        <thead><tr>
                            <th scope="col" data-i18n="ws-settings-col-alias">Alias</th>
                            <th scope="col" data-i18n="model-label">Model</th>
                            <th scope="col" data-i18n="model-efforts">Efforts</th>
                            <th scope="col" data-i18n="ws-settings-col-state">State</th>
                            <th scope="col" data-i18n="ws-settings-col-actions">Actions</th>
                        </tr></thead>
                        <tbody data-models-alias-rows></tbody>
                    </table>
                </figure>
                <h3 data-i18n="model-catalog">Model catalog</h3>
                <form data-models-search-form>
                    <fieldset role="group">
                        <input type="search" name="q" aria-label="Search model catalog" placeholder="Search model catalog…" autocomplete="off" spellcheck="false">
                        <button type="submit" data-i18n="search">Search</button>
                    </fieldset>
                </form>
                <p>
                    <span data-i18n="model-offset">Offset:</span> <span data-text="model-offset">0</span>
                    <span data-i18n="models-shown">Shown:</span> <span data-text="model-count">0</span>
                    <span data-i18n="models-total">Total:</span> <span data-text="model-total">0</span>
                </p>
                <p data-text="model-more"></p>
                <figure>
                    <table>
                        <thead><tr>
                            <th scope="col" data-i18n="model-selector">Selector</th>
                            <th scope="col" data-i18n="model-name">Name</th>
                            <th scope="col" data-i18n="model-context">Context</th>
                            <th scope="col" data-i18n="model-efforts">Efforts</th>
                            <th scope="col" data-i18n="model-readiness">Readiness</th>
                        </tr></thead>
                        <tbody data-models-catalog-rows></tbody>
                    </table>
                </figure>
            </section>
            <section data-settings-panel="mcp" aria-label="MCP servers" data-family-count="0" data-candidate-count="0" hidden>
                <header data-panel-toolbar>
                    <h2 data-i18n="ws-settings-mcp-heading">MCP servers</h2>
                </header>
                <details data-family-disclosure="mcp">
                    <summary data-i18n="ws-settings-add-mcp">+ Add server</summary>
                    <form data-family-discover-form data-family="mcp">
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <input type="search" name="query" aria-label="Search MCP registry" placeholder="Search MCP registry…" autocomplete="off" required>
                            <button type="submit" data-i18n="ws-settings-discover">Discover</button>
                        </fieldset>
                    </form>
                    <ul data-candidate-rows></ul>
                    <form data-mcp-save-form data-mcp-transport="stdio" data-mcp-auth="none">
                        <fieldset data-bind="disabled:ws-settings-busy">
                            <select name="transport" aria-label="MCP transport">
                                <option value="stdio" data-i18n="ws-settings-mcp-stdio">Local command (stdio)</option>
                                <option value="streamable-http" data-i18n="ws-settings-mcp-http">Remote endpoint (Streamable HTTP)</option>
                            </select>
                            <input type="text" name="alias" aria-label="Server alias" placeholder="server-alias" autocomplete="off" spellcheck="false" required>
                            <div data-mcp-stdio-fields>
                                <input type="text" name="command" aria-label="Server command" placeholder="Command (e.g. npx)" autocomplete="off" spellcheck="false">
                                <input type="text" name="args" aria-label="Server arguments" placeholder="Arguments (space-separated)" autocomplete="off" spellcheck="false">
                                <input type="text" name="cwd" aria-label="Working directory" placeholder="Working directory (optional)" autocomplete="off" spellcheck="false">
                            </div>
                            <div data-mcp-http-fields>
                                <input type="url" name="url" aria-label="Endpoint URL" placeholder="https://mcp.example.com/mcp" autocomplete="off" spellcheck="false">
                                <select name="authMode" aria-label="Endpoint authentication">
                                    <option value="none" data-i18n="ws-settings-auth-none">No authorization</option>
                                    <option value="bearer" data-i18n="ws-settings-auth-bearer">Bearer token reference</option>
                                    <option value="oauth" data-i18n="ws-settings-auth-oauth">OAuth 2.1</option>
                                </select>
                                <input type="text" name="bearerToken" data-mcp-bearer-field aria-label="Bearer token reference" placeholder="${MCP_TOKEN}" autocomplete="off" spellcheck="false">
                            </div>
                            <footer>
                                <button type="submit" data-i18n="ws-settings-save-server">Save server</button>
                            </footer>
                        </fieldset>
                    </form>
                </details>
                <p data-family-empty data-i18n="ws-settings-mcp-empty">No MCP servers configured.</p>
                <figure data-family-table-wrap>
                    <table>
                        <thead><tr>
                            <th scope="col" data-i18n="ws-settings-col-alias">Alias</th>
                            <th scope="col" data-i18n="ws-settings-col-origin">Origin</th>
                            <th scope="col" data-i18n="ws-settings-col-details">Details</th>
                            <th scope="col" data-i18n="ws-settings-col-state">State</th>
                            <th scope="col" data-i18n="ws-settings-col-actions">Actions</th>
                        </tr></thead>
                        <tbody data-family-rows></tbody>
                    </table>
                </figure>
                <section data-mcp-oauth-box aria-label="MCP OAuth authorization" hidden>
                    <p><span data-i18n="ws-settings-oauth-open">Authorize server:</span> <a data-mcp-oauth-link href="/" target="_blank" rel="noopener noreferrer" data-bind="href:mcp-oauth-url" data-text="mcp-oauth-url"></a></p>
                    <form data-mcp-oauth-complete-form>
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <input type="hidden" name="alias" data-bind="value:mcp-oauth-alias">
                            <input type="url" name="callbackUrl" aria-label="OAuth callback URL" placeholder="Callback URL from authorization" autocomplete="off" required>
                            <button type="submit" data-i18n="ws-settings-oauth-complete">Complete authorization</button>
                        </fieldset>
                    </form>
                </section>
            </section>
            <section data-settings-panel="skills" aria-label="Skills" data-family-count="0" data-candidate-count="0" hidden>
                <header data-panel-toolbar>
                    <h2 data-i18n="ws-settings-tab-skills">Skills</h2>
                </header>
                <details data-family-disclosure="skills">
                    <summary data-i18n="ws-settings-add-skill">+ Add skill</summary>
                    <form data-family-discover-form data-family="skills">
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <input type="text" name="source" aria-label="Skill discovery source" placeholder="Git URL, folder, archive, or server:///skills" autocomplete="off" spellcheck="false" required>
                            <button type="submit" data-i18n="ws-settings-discover">Discover</button>
                        </fieldset>
                    </form>
                    <ul data-candidate-rows></ul>
                    <form data-skills-save-form>
                        <fieldset data-bind="disabled:ws-settings-busy">
                            <input type="text" name="alias" aria-label="Skill name" placeholder="skill-name" autocomplete="off" spellcheck="false" required>
                            <input type="text" name="source" aria-label="Skill source" placeholder="https://git.example/skills.git or /path/to/skill" autocomplete="off" spellcheck="false" required>
                            <input type="text" name="ref" aria-label="Git ref" placeholder="Branch or tag (optional)" autocomplete="off" spellcheck="false">
                            <footer>
                                <button type="submit" data-i18n="ws-settings-save-skill">Save skill</button>
                            </footer>
                        </fieldset>
                    </form>
                </details>
                <p data-family-empty data-i18n="ws-settings-skills-empty">No skills configured.</p>
                <figure data-family-table-wrap>
                    <table>
                        <thead><tr>
                            <th scope="col" data-i18n="ws-settings-col-alias">Alias</th>
                            <th scope="col" data-i18n="ws-settings-col-origin">Origin</th>
                            <th scope="col" data-i18n="ws-settings-col-details">Details</th>
                            <th scope="col" data-i18n="ws-settings-col-state">State</th>
                            <th scope="col" data-i18n="ws-settings-col-actions">Actions</th>
                        </tr></thead>
                        <tbody data-family-rows></tbody>
                    </table>
                </figure>
            </section>
            <section data-settings-panel="schedule" aria-label="Schedules" data-family-count="0" data-candidate-count="0" hidden>
                <header data-panel-toolbar>
                    <h2 data-i18n="ws-settings-schedules-heading">Schedules</h2>
                </header>
                <details data-family-disclosure="schedule">
                    <summary data-i18n="ws-settings-add-schedule">+ Add schedule</summary>
                    <form data-family-discover-form data-family="schedule">
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <input type="text" name="rule" aria-label="Preview schedule rule" placeholder="0 9 * * 1-5 or FREQ=DAILY;BYHOUR=9" autocomplete="off" spellcheck="false" required>
                            <button type="submit" data-i18n="ws-settings-preview-rule">Preview</button>
                        </fieldset>
                    </form>
                    <ul data-candidate-rows></ul>
                    <form data-schedule-save-form>
                        <fieldset data-bind="disabled:ws-settings-busy">
                            <input type="text" name="alias" aria-label="Schedule name" placeholder="nightly-check" autocomplete="off" spellcheck="false" required>
                            <input type="text" name="target" aria-label="Target session" placeholder="session1" autocomplete="off" spellcheck="false" required>
                            <input type="text" name="rule" aria-label="Schedule rule" placeholder="0 9 * * 1-5 or FREQ=DAILY" autocomplete="off" spellcheck="false" required>
                            <textarea name="prompt" aria-label="Scheduled prompt" placeholder="Message delivered at each occurrence" rows="2" required></textarea>
                            <footer>
                                <button type="submit" data-i18n="ws-settings-save-schedule">Save schedule</button>
                            </footer>
                        </fieldset>
                    </form>
                </details>
                <p data-family-empty data-i18n="ws-settings-schedule-empty">No schedules configured.</p>
                <figure data-family-table-wrap>
                    <table>
                        <thead><tr>
                            <th scope="col" data-i18n="ws-settings-col-alias">Alias</th>
                            <th scope="col" data-i18n="ws-settings-col-origin">Origin</th>
                            <th scope="col" data-i18n="ws-settings-col-details">Details</th>
                            <th scope="col" data-i18n="ws-settings-col-state">State</th>
                            <th scope="col" data-i18n="ws-settings-col-actions">Actions</th>
                        </tr></thead>
                        <tbody data-family-rows></tbody>
                    </table>
                </figure>
            </section>
            <section data-settings-panel="personas" aria-label="Personas" data-family-count="0" data-candidate-count="0" hidden>
                <header data-panel-toolbar>
                    <h2 data-i18n="ws-settings-tab-personas">Personas</h2>
                </header>
                <details data-family-disclosure="personas">
                    <summary data-i18n="ws-settings-add-persona">+ Add persona</summary>
                    <form data-family-discover-form data-family="personas">
                        <fieldset role="group" data-bind="disabled:ws-settings-busy">
                            <input type="text" name="source" aria-label="Persona discovery path" placeholder="Directory or file path (optional)" autocomplete="off" spellcheck="false">
                            <button type="submit" data-i18n="ws-settings-discover">Discover</button>
                        </fieldset>
                    </form>
                    <ul data-candidate-rows></ul>
                    <form data-personas-save-form data-persona-mode="inline">
                        <fieldset data-bind="disabled:ws-settings-busy">
                            <select name="personaMode" aria-label="Persona mode">
                                <option value="inline" data-i18n="ws-settings-persona-inline">Inline instructions</option>
                                <option value="source" data-i18n="ws-settings-persona-source">Markdown file path</option>
                            </select>

        </tr>
    </template>
    <!-- {§web-session-approval} One explicit decision per operation, one complete resume. -->
    <template id="session-review">
        <form aria-label="Review requests" data-request-count="0">
            <fieldset disabled data-bind="disabled:review-unavailable">
                <legend data-i18n="input-required">Input required</legend>
                <p role="alert" data-deadline-notice data-i18n="deadline-passed">The decision deadline has passed; the daemon cancels these requests.</p>
                <div data-requests></div>
                <button type="submit" data-i18n="submit-responses">Submit responses</button>
            </fieldset>
        </form>
    </template>
    <!-- {§web-session-questions} Request data never supplies markup or application bindings. -->
    <template id="session-question">
        <fieldset data-question data-response-error="">
            <legend><span data-request-origin><span data-i18n="request-session">Session</span> <span data-text="request-session">Unknown</span></span> <code data-text="request-tool">Question</code></legend>
            <p data-request-message></p>
            <details>
                <summary data-i18n="request-details">Request details</summary>
                <pre><code data-request-arguments></code></pre>
            </details>
            <details>
                <summary data-i18n="response-schema">Response schema</summary>
                <pre><code data-request-schema></code></pre>
            </details>
            <label><input type="checkbox" data-answer-cancel> <span data-i18n="cancel-request">Cancel this request</span></label>
            <fieldset data-answer-fields></fieldset>
            <p role="alert" data-response-error data-text="response-error">Answer validation failed.</p>
        </fieldset>
    </template>
    <template id="answer-field">
        <fieldset>
            <legend data-text="field-title">Answer field</legend>
            <p data-text="field-description">Field description</p>
            <label data-optional-answer><input type="checkbox" data-answer-include> <span data-i18n="include-answer">Include this answer</span></label>
            <fieldset data-answer-value></fieldset>
        </fieldset>
    </template>
    <template id="answer-text"><textarea rows="2" data-bind="aria-label:answer-label"></textarea></template>
    <template id="answer-number"><input type="number" step="any" required data-bind="aria-label:answer-label"></template>
    <template id="answer-boolean" data-otm-dynamic>
        <select required data-bind="aria-label:answer-label"><option value="" data-i18n="choose-answer">Choose an answer</option><option value="true" data-i18n="yes">Yes</option><option value="false" data-i18n="no">No</option></select>
    </template>
    <template id="answer-select" data-otm-dynamic>
        <select required data-bind="aria-label:answer-label"><option value="" data-i18n="choose-answer">Choose an answer</option></select>
    </template>
    <template id="answer-option"><option data-bind="value:option-value" data-text="option-label">Option</option></template>
    <template id="answer-choice"><label><input type="checkbox" data-answer-choice data-bind="value:option-value"> <span data-text="option-label">Option</span></label></template>
    <template id="answer-json"><label><span data-i18n="json-answer">Answer (JSON)</span><textarea rows="6" spellcheck="false" required></textarea></label></template>
    <template id="session-proposal">
        <fieldset data-proposal-target-empty="false" data-proposal-has-diff="false" data-proposal-body-empty="false" data-proposal-editable="false">
            <legend><span data-text="proposal-session">Session</span> <code data-text="proposal-op">Operation</code></legend>
            <p data-proposal-target-line><code data-proposal-target></code></p>
            <pre data-proposal-diff><code></code></pre>
            <pre data-proposal-body-block><code data-proposal-body></code></pre>
            <p data-proposal-deadline-line><span data-i18n="decide-by">Decide by</span> <time data-bind="datetime:proposal-deadline" data-text="proposal-deadline-label"></time></p>
            <label><input type="radio" value="accept" required data-bind="name:proposal-choice"> <span data-i18n="accept">Accept</span></label>
            <label><input type="radio" value="reject" required data-bind="name:proposal-choice"> <span data-i18n="reject">Reject</span></label>
            <label data-proposal-edit-choice><input type="radio" value="edit" required data-bind="name:proposal-choice"> <span data-i18n="edit">Edit</span></label>
            <label data-proposal-edit-field><span data-i18n="edited-proposal-body">Edited body</span><textarea rows="4" spellcheck="false" data-proposal-edit-body data-bind="name:proposal-edit-name"></textarea></label>
        </fieldset>
    </template>
    <template id="proposal-diff-add"><ins data-diff-line="add"></ins></template>
    <template id="proposal-diff-del"><del data-diff-line="del"></del></template>
    <template id="proposal-diff-line"><span data-diff-line="context"></span></template>
    <!-- {§web-session-conversation} Inert document-owned structure; the ACP client supplies its values. -->
    <template id="conversation-history">
        <li data-history-boundary>
            <form data-bind="aria-busy:history-pending">
                <button type="submit" data-bind="disabled:history-pending" data-i18n="load-earlier-messages">Load earlier messages</button>
                <p role="alert" data-text="history-error"></p>
            </form>
        </li>
    </template>
    <template id="prompt-work">
        <details data-prompt-work>
            <summary data-bind="aria-label:operations-label"><span data-prompt-pills></span></summary>
            <ul data-work-items></ul>
        </details>
    </template>
    <template id="conversation-operations">
        <li data-operations="">
            <details data-prompt-work>
                <summary data-bind="aria-label:operations-label"><span data-prompt-pills></span></summary>
                <ul data-work-items></ul>
            </details>
        </li>
    </template>
    <template id="operation-tally">
        <span data-operation-tally><span data-plurnk-field="heading"></span><span data-plurnk-field="count"></span></span>
    </template>
    <template id="prompt-replies">
        <ul data-prompt-replies></ul>
    </template>
    <template id="conversation-message">
        <li>
            <article data-bind="aria-label:message-label"></article>
        </li>
    </template>
    <template id="message-actor-text">
        <small data-message-actor><span data-text="actor-name"></span></small>
    </template>
    <template id="message-actor-link">
        <small data-message-actor><a data-workspace-route="session" data-bind="href:actor-href" data-text="actor-name"></a></small>
    </template>
    <template id="reading-slate-jump">
        <div data-jump-slot><button type="button" data-jump-bottom aria-label="Jump to latest" title="Jump to latest" hidden></button></div>
    </template>
    <template id="reading-slate-spacer">
        <svg data-slate-spacer width="1" height="0" aria-hidden="true"></svg>
    </template>
    <!-- {§web-card-disclosure} Summary fields are phrasing content, not nested headers or paragraphs. -->
    <template id="card-disclosure">
        <details><summary></summary></details>
    </template>
    <template id="card-header">
        <header></header>
    </template>
    <template id="conversation-literal">
        <pre></pre>
    </template>
    <!-- {§web-operation-summary} Shared summary; the stylesheet owns operation glyphs. -->
    <template id="operation-header">
        <span data-plurnk-field="heading"></span>
    </template>
    <template id="operation-operands">
        <span data-plurnk-operands></span>
    </template>
    <template id="operation-operand">
        <span data-plurnk-operand></span>
    </template>
    <template id="operation-field">
        <span></span>
    </template>
    <template id="operation-outcome">
        <span data-plurnk-field="outcome"></span>
    </template>
    <!-- {§web-diagram-content} Only the generated data-URI image enters this template. -->
    <template id="diagram-retry">
        <button type="button" data-diagram-retry data-i18n="diagram-retry">Retry diagram</button>
    </template>
    <template id="conversation-diagram">
        <figure data-diagram hidden>
            <div data-diagram-viewport><img alt="Mermaid diagram; source below."></div>
            <details>
                <summary data-i18n="diagram-source">Diagram source</summary>
                <pre><code data-diagram-source></code></pre>
            </details>
        </figure>
    </template>
</body>
</html>
